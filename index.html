  --green:#1F8A57; --green-bg:#DEF3E7; --green-line:#A6DEBF;
  --blue:#1F6FA8; --blue-bg:#DDEDF9; --blue-line:#A2CDEA;
  --purple:#6E4DB0; --purple-bg:#EBE3F8; --purple-line:#C5AEE8;
  --teal:#12897A; --teal-bg:#DBF2EE; --teal-line:#96D9CC;
  --coral:#D65B3A; --coral-bg:#FCE6DD; --coral-line:#F0B49B;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.45;}
h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:600;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{max-width:1180px;margin:0 auto;padding:0 0 80px;}
header.top{padding:16px 20px;background:var(--ink);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header.top .brandline{display:flex;align-items:center;gap:14px;}
header.top .logo{height:34px;display:block;background:#fff;padding:4px 8px;border-radius:6px;}
header.top h1{font-size:19px;letter-spacing:.2px;color:#fff;}
header.top .sub{font-size:12.5px;color:#D8CFB8;}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 20px;background:var(--paper);position:sticky;top:0;z-index:20;border-bottom:2px solid var(--line-strong);}
nav.tabs button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;}
nav.tabs button .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
nav.tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.toolbar{display:flex;gap:8px;align-items:center;padding:9px 20px;background:#EFE8D6;border-bottom:1px solid var(--line-strong);flex-wrap:wrap;position:sticky;top:52px;z-index:19;}
.toolbar label{margin:0;font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
.toolbar input[type=month]{width:auto;padding:6px 8px;}
.toolbar .spacer{flex:1;min-width:6px;}
#print-title{display:none;}
main{padding:20px;}
.grid{display:grid;gap:14px;}
.cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:var(--radius);padding:16px;}

.card.acc-blue{border-left-color:var(--blue);}
.card.acc-teal{border-left-color:var(--teal);}
.card.acc-green{border-left-color:var(--green);}

.card.acc-coral{border-left-color:var(--coral);}
.card.acc-red{border-left-color:var(--red);}
.card h3{font-size:14px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
.card .big{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}
.card .small{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.scanner-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;}
.scanner-chip.SV600{background:var(--teal-bg);color:var(--teal);}
.scanner-chip.ViisanTR{background:var(--purple-bg);color:var(--purple);}
.scanner-chip.CamerasTR{background:var(--coral-bg);color:var(--coral);}
.scanner-chip.ScannerTeck{background:var(--blue-bg);color:var(--blue);}

.scanner-chip.Servidor2{background:var(--green-bg);color:var(--green);}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px;}
.section-title h2{font-size:17px;}
.stamp{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;border:2px solid;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;transform:rotate(-2deg);}
.stamp.red{color:var(--red);border-color:var(--red);background:var(--red-bg);}
.stamp.amber{color:var(--amber);border-color:var(--amber);background:var(--amber-bg);}
.stamp.green{color:var(--green);border-color:var(--green);background:var(--green-bg);}
.stamp.blue{color:var(--blue);border-color:var(--blue);background:var(--blue-bg);}
.stamp.gray{color:var(--ink-faint);border-color:var(--line-strong);background:var(--paper);transform:rotate(0);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);}
th{color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;}
tr:hover td{background:#FBFAF6;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 12px;overflow-x:auto;}
form.entryform{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-bottom:16px;}
label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
input,select{width:100%;padding:8px 9px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;font-size:13.5px;font-family:'Inter',sans-serif;color:var(--ink);}
input:focus,select:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass);}
button.btn{padding:9px 16px;border-radius:7px;border:1px solid var(--brass);background:var(--brass);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;}
button.btn.secondary{background:var(--card);color:var(--brass-dark);}
button.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink-soft);}
button.btn.danger{background:var(--red);border-color:var(--red);}
button.btn:hover{opacity:.9;}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.bar-outer{width:100%;height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px;}
.bar-inner{height:100%;border-radius:99px;}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--brass-bg);color:var(--brass-dark);font-weight:600;}
.opheader{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.muted{color:var(--ink-faint);font-size:12px;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.badgebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.empty{padding:26px;text-align:center;color:var(--ink-faint);font-size:13px;}
.op-status-row{display:flex;align-items:center;gap:8px;}
select[multiple]{height:auto;}
.footnote{font-size:11px;color:var(--ink-faint);margin-top:6px;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;}
@media(max-width:640px){
  nav.tabs{padding:8px 10px;}
  .toolbar{top:46px;}
  main{padding:12px;}
  form.entryform{grid-template-columns:1fr 1fr;}

@media print{
  header.top,nav.tabs,.toolbar,form.entryform,button{display:none !important;}
  #print-title{display:block;font-family:'Source Serif 4',serif;font-size:18px;margin:10px 4px;}
  body{background:#fff;}
  #app{max-width:100%;padding:0;}
  main{padding:6px;}
  .card{break-inside:avoid;border:1px solid #999;}
  table{font-size:11px;}
  .tablewrap{border:none;padding:0;}
}
</style>

function monthKey(d){ return d.slice(0,7); }
function weekRange(d){
  const dt = new Date(d+"T00:00:00");
  const day = (dt.getDay()+6)%7;
  const monday = new Date(dt); monday.setDate(dt.getDate()-day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return {start: monday.toISOString().slice(0,10), end: sunday.toISOString().slice(0,10)};
}

function shiftMonth(mk, n){
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthsBetween(mkStart, mkEnd){
  const [y1,m1] = mkStart.split('-').map(Number);
  const [y2,m2] = mkEnd.split('-').map(Number);
  return (y2-y1)*12 + (m2-m1);
}

  const [y,m] = mk.split('-');

}

async function loadJSON(key, fallback){
  try{
    const ref = doc(db, FIRESTORE_COLLECTION, key);
    const snap = await getDoc(ref);
    return snap.exists() ? snap.data().value : fallback;
  }catch(e){
    console.error('Firestore load error ['+key+']', e);
    setCloudStatus('erro');
    return fallback;
  }
}
async function saveJSON(key, value){
  try{
    const ref = doc(db, FIRESTORE_COLLECTION, key);
    await setDoc(ref, {value, atualizadoEm: Date.now()});
    setCloudStatus('ok');
  }catch(e){
    console.error('Firestore save error ['+key+']', e);
    setCloudStatus('erro');
    toast('Erro ao salvar na nuvem. Verifique sua conexão.');
  }
}
function setCloudStatus(status){
  const el = document.getElementById('cloud-status');
  if(!el) return;
  if(status==='ok') el.innerHTML = '☁️ sincronizado';
  else if(status==='erro') el.innerHTML = '⚠️ erro de conexão com a nuvem';
  else el.innerHTML = '☁️ conectando…';
}

function statusInfo(percent){
  const t = state.thresholds;
  if(percent < t.baixa) return {label:'Baixa', cls:'red'};
  if(percent < t.media) return {label:'Média', cls:'amber'};
  if(percent < t.boa) return {label:'Boa', cls:'green'};
  return {label:'Excelente', cls:'blue'};
}
function statusStamp(percent){
  const s = statusInfo(percent);
  return `<span class="stamp ${s.cls}">${s.label}</span>`;
}
function barColor(cls){
  return cls==='red'?'var(--red)':cls==='amber'?'var(--amber)':cls==='green'?'var(--green)':'var(--blue)';
}
function progressBar(percent){
  const s = statusInfo(percent);
  const w = Math.min(percent,130);
  return `<div class="bar-outer"><div class="bar-inner" style="width:${w}%;background:${barColor(s.cls)}"></div></div>`;
}

function metaDoDia(op, entry){
  if(op.funcao==='Digitalizador'){
    const base = state.metasScanner[entry && entry.scanner ? entry.scanner : op.scanner] || {diaria:0,hora:0};
    if(entry && entry.metaManual) return Number(entry.metaManual);
    if(entry && entry.horas) return Math.round(base.hora * Number(entry.horas));
    return base.diaria;
  }
  if(op.funcao==='Higienizador'){
    if(entry && entry.metaManual) return Number(entry.metaManual);
    return state.metaHigienizacao;
  }
  if(op.funcao==='Controle de Qualidade'){
    if(entry && entry.metaManual) return Number(entry.metaManual);
    return state.metaQualidade.finalizados;
  }
  return 0;
}

function downloadCSV(filename, headers, rows){
  const esc = (c)=>{
    const s = (c===undefined||c===null)?'':String(c);
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const csv = [headers.map(esc).join(';')].concat(rows.map(r=>r.map(esc).join(';'))).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
}
async function exportCurrentTab(){
  const mk = refMonth;
  let headers=[], rows=[], filename='dados_'+mk+'.csv';
  if(currentTab==='digitalizacao'){
    const arr = await getMonthArr('producao', mk);
    headers=['Data','Operador','Escâner','Arquivos','Caixas','NID','Observação'];
    rows = arr.map(p=>{
      const op = state.operadores.find(o=>o.id===p.operadorId);
      return [p.data, op?op.nome:'', SCANNER_LABEL[p.scanner]||'', p.arquivos, p.caixas, p.nid, p.obs||''];
    });
    filename = 'digitalizacao_'+mk+'.csv';
  } else if(currentTab==='arqger'){
    const envio = await getMonthArr('envio', mk);
    const aprov = await getMonthArr('aprovacoes', mk);
    headers=['Tipo','Data','Responsável','Arquivos / Aprovados','NIDs / Consertos'];
    rows = envio.map(e=>['Envio', e.data, e.responsavel||'', e.arquivos, e.nids])
      .concat(aprov.map(a=>['Aprovação', a.data, a.responsavel||'', a.aprovados, a.consertos]));
    filename = 'arqger_'+mk+'.csv';
  } else if(currentTab==='higienizacao'){
    const arr = await getMonthArr('higienizacao', mk);
    headers=['Data','Operador','Caixas'];
    rows = arr.map(h=>{ const op=state.operadores.find(o=>o.id===h.operadorId); return [h.data, op?op.nome:'', h.caixas]; });
    filename = 'higienizacao_'+mk+'.csv';
  } else if(currentTab==='qualidade'){
    const arr = await getMonthArr('qualidade', mk);
    headers=['Data','Operador','QC','Finalizados','Certificado','OCR','PDF/A'];
    rows = arr.map(q=>{ const op=state.operadores.find(o=>o.id===q.operadorId); return [q.data, op?op.nome:'', q.arquivosQC, q.finalizados, q.certificado, q.ocerizado, q.pdfA]; });
    filename = 'qualidade_'+mk+'.csv';
  } else if(currentTab==='painel' || currentTab==='dashboard'){
    const prod = await getMonthArr('producao', mk);
    headers=['Operador','Escâner','Total mês','Meta mês','%'];
    rows = state.operadores.filter(o=>o.funcao==='Digitalizador').map(op=>{
      const regs = prod.filter(p=>p.operadorId===op.id);
      const total = regs.reduce((s,p)=>s+Number(p.arquivos||0),0);
      const meta = regs.reduce((s,p)=>s+metaDoDia(op,p),0);
      return [op.nome, SCANNER_LABEL[op.scanner]||'', total, meta, meta?Math.round(pct(total,meta))+'%':''];
    });
    filename = 'painel_'+mk+'.csv';
  } else if(currentTab==='historico'){
    if(window.__historicoData){
      headers = window.__historicoData.headers;
      rows = window.__historicoData.rows;
      filename = 'historico_'+(window.__historicoData.opNome||'operador').replace(/\s+/g,'_')+'.csv';
    } else { toast('Selecione um operador no histórico primeiro.'); return; }
  } else {
    toast('Não há tabela para exportar nesta aba.'); return;
  }
  if(!rows.length){ toast('Nada para exportar neste mês.'); return; }
  downloadCSV(filename, headers, rows);
}
function printCurrentTab(){
  const label = (TABS.find(t=>t.id===currentTab)||{}).label || '';
  const pt = document.getElementById('print-title');
  if(pt) pt.textContent = 'Tempo Real Produção e Comunicação · '+label+' · '+monthLabel(refMonth);
  window.print();
}

const TABS = [
  {id:'painel', label:'Painel', color:'var(--brass)'},
  {id:'dashboard', label:'Dashboard geral', color:'var(--coral)'},
  {id:'contrato', label:'Contrato TJRJ', color:'var(--brass-dark)'},
  {id:'digitalizacao', label:'Digitalização', color:'var(--teal)'},
  {id:'arqger', label:'ArqGer (faturamento)', color:'var(--blue)'},
  {id:'nas', label:'NAS (backup)', color:'var(--ink-faint)'},
  {id:'higienizacao', label:'Higienização', color:'var(--green)'},
  {id:'qualidade', label:'Qualidade', color:'var(--purple)'},
  {id:'operadores', label:'Operadores', color:'var(--coral)'},
  {id:'historico', label:'Histórico operador', color:'var(--purple)'},
  {id:'metas', label:'Metas', color:'var(--ink-faint)'},
  {id:'fechamento', label:'Fechamento', color:'var(--red)'}
];

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}"><span class="dot" style="background:${t.color}"></span>${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ currentTab=b.dataset.tab; render(); });
}

function renderToolbar(){
  const tb = document.getElementById('toolbar');
  if(!tb) return;
  const minMonth = shiftMonth(todayStr.slice(0,7), -60);
  const maxMonth = shiftMonth(todayStr.slice(0,7), 12);
  tb.innerHTML = `
    <label for="mes-ref">Mês de referência</label>
    <input type="month" id="mes-ref" value="${refMonth}" min="${minMonth}" max="${maxMonth}">
    <button class="btn secondary" id="btn-mes-atual" type="button">Mês atual</button>
    <span class="mono" style="font-size:12.5px;color:var(--ink-faint);">${monthLabel(refMonth)}</span>
    <span class="spacer"></span>
    <button class="btn ghost" id="btn-imprimir" type="button">🖨️ Imprimir mês</button>
    <button class="btn ghost" id="btn-exportar" type="button">💾 Exportar CSV</button>
  `;
  const mesInput = document.getElementById('mes-ref');
  if(mesInput) mesInput.onchange = ()=>{ if(mesInput.value){ refMonth = mesInput.value; render(); } };
  const btnMesAtual = document.getElementById('btn-mes-atual');
  if(btnMesAtual) btnMesAtual.onclick = ()=>{ refMonth = todayStr.slice(0,7); render(); };
  const btnImprimir = document.getElementById('btn-imprimir');
  if(btnImprimir) btnImprimir.onclick = ()=> printCurrentTab();
  const btnExportar = document.getElementById('btn-exportar');
  if(btnExportar) btnExportar.onclick = ()=> exportCurrentTab();
}

async function render(){
  document.getElementById('hoje-label').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  renderTabs();
  renderToolbar();
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Carregando…</div>';
  if(currentTab==='painel') main.innerHTML = await renderPainel();
  else if(currentTab==='dashboard') main.innerHTML = await renderDashboardGeral();
  else if(currentTab==='contrato') main.innerHTML = renderContrato();
  else if(currentTab==='digitalizacao') main.innerHTML = await renderDigitalizacao();
  else if(currentTab==='arqger') main.innerHTML = await renderArqger();
  else if(currentTab==='nas') main.innerHTML = await renderNas();
  else if(currentTab==='higienizacao') main.innerHTML = await renderHigienizacao();
  else if(currentTab==='qualidade') main.innerHTML = await renderQualidade();
  else if(currentTab==='operadores') main.innerHTML = renderOperadores();
  else if(currentTab==='historico') main.innerHTML = await renderHistorico();
  else if(currentTab==='metas') main.innerHTML = renderMetas();
  else if(currentTab==='fechamento') main.innerHTML = await renderFechamento();
  bindHandlers();
}

// ---------- CONTRATO TJRJ ----------
function diasUteisEntre(d1,d2){
  let count=0; const cur=new Date(d1+"T00:00:00"); const end=new Date(d2+"T00:00:00");
  while(cur<=end){ const wd=cur.getDay(); if(wd!==0 && wd!==6) count++; cur.setDate(cur.getDate()+1); }
  return count;
}
function renderContrato(){
  const c = state.contratoTJRJ;
  const t = state.contratoTotais;
  const imagensMeta = c.imagensMeta || (c.processosMeta * c.folhasMedia);
  const p = pct(t.arquivos, imagensMeta);
  const s = statusInfo(p);
  let prazoInfo = '';
  if(c.dataInicio){
    const inicio = new Date(c.dataInicio+"T00:00:00");
    const fim = new Date(inicio); fim.setFullYear(fim.getFullYear()+Number(c.duracaoAnos||4));
    const hojeDt = new Date(todayStr+"T00:00:00");
    const diasUteisRestantes = Math.max(0, diasUteisEntre(todayStr>c.dataInicio?todayStr:c.dataInicio, fim.toISOString().slice(0,10)));
    const restante = Math.max(0, imagensMeta - t.arquivos);
    const ritmoNecessario = diasUteisRestantes>0 ? Math.ceil(restante/diasUteisRestantes) : 0;
    const diasCorridosRestantes = Math.max(0, Math.round((fim-hojeDt)/(1000*60*60*24)));
    prazoInfo = `
    <div class="grid cards">
      <div class="card acc-brass"><h3>Prazo contratual</h3><div class="big">${fim.toLocaleDateString('pt-BR')}</div><div class="small">início em ${inicio.toLocaleDateString('pt-BR')} · ${diasCorridosRestantes} dias corridos restantes</div></div>
      <div class="card acc-blue"><h3>Ritmo necessário</h3><div class="big">${fmt(ritmoNecessario)}</div><div class="small">imagens por dia útil, para cumprir o prazo (${fmt(diasUteisRestantes)} dias úteis restantes)</div></div>
    </div>`;
  } else {
    prazoInfo = `<div class="card acc-amber" style="margin-top:14px"><h3>Data de início não definida</h3><div class="small">Informe a data do memorando de início abaixo para calcular o ritmo diário necessário e o prazo final.</div></div>`;
  }
  return `
  <div class="section-title"><h2>${c.nome}</h2>${statusStamp(p)}</div>
  <div class="grid cards">
    <div class="card acc-brass"><h3>Imagens digitalizadas (total do contrato)</h3><div class="big">${fmt(t.arquivos)}</div><div class="small">meta: ${fmt(imagensMeta)} · ${Math.round(p)}% concluído</div>${progressBar(p)}</div>
    <div class="card acc-teal"><h3>Processos estimados</h3><div class="big">${fmt(c.processosMeta)}</div><div class="small">média de ${fmt(c.folhasMedia)} folhas/imagens por processo</div></div>
    <div class="card acc-coral"><h3>Caixas recebidas (total)</h3><div class="big">${fmt(t.caixas)}</div></div>
    <div class="card acc-purple"><h3>Falta digitalizar</h3><div class="big">${fmt(Math.max(0,imagensMeta-t.arquivos))}</div><div class="small">imagens até a meta contratual</div></div>
  </div>
  ${prazoInfo}
  <div class="section-title"><h2>Configurar dados do contrato</h2></div>
  <form class="entryform" id="form-contrato">
    <div style="grid-column:1/-1"><label>Nome / identificação do contrato</label><input type="text" name="nome" value="${c.nome}"></div>
    <div><label>Processos (quantidade total)</label><input type="number" min="0" name="processosMeta" value="${c.processosMeta}"></div>
    <div><label>Média de folhas por processo</label><input type="number" min="0" name="folhasMedia" value="${c.folhasMedia}"></div>
    <div><label>Meta de imagens (auto ou manual)</label><input type="number" min="0" name="imagensMeta" value="${c.imagensMeta}"></div>
    <div><label>Data do memorando de início</label><input type="date" name="dataInicio" value="${c.dataInicio||''}"></div>
    <div><label>Duração do contrato (anos)</label><input type="number" min="1" name="duracaoAnos" value="${c.duracaoAnos}"></div>
    <div><button class="btn" type="submit">Salvar</button></div>
  </form>
  <div class="footnote">Os totais acima somam automaticamente todos os lançamentos de digitalização feitos na aba Digitalização, desde o início do uso do sistema. A meta de imagens é calculada como processos × folhas médias, mas pode ser sobrescrita manualmente.</div>
  `;
}

// ---------- DASHBOARD GERAL ----------
async function contratoMesesProducao(){
  const c = state.contratoTJRJ;
  const inicioMk = c.dataInicio ? c.dataInicio.slice(0,7) : refMonth;
  let n = monthsBetween(inicioMk, refMonth);
  if(n<0) n=0;
  if(n>47) n=47; // limite de segurança (4 anos)
  const out = [];
  for(let i=0;i<=n;i++){
    const mk = shiftMonth(inicioMk, i);
    const arr = await getMonthArr('producao', mk);
    out.push({mk, total: arr.reduce((s,p)=>s+Number(p.arquivos||0),0)});
  }
  return out;
}
async function renderDashboardGeral(){
  const mk = refMonth;
  const prod = await getMonthArr('producao', mk);
  const digitalizadores = state.operadores.filter(o=>o.funcao==='Digitalizador' && o.ativo);
  const ranking = digitalizadores.map(op=>{
    const regs = prod.filter(p=>p.operadorId===op.id);
    const total = regs.reduce((s,p)=>s+Number(p.arquivos||0),0);
    const meta = regs.reduce((s,p)=>s+metaDoDia(op,p),0);
    return {op, total, meta, p: pct(total, meta||1)};
  }).sort((a,b)=>b.p-a.p);

  const c = state.contratoTJRJ;
  const imagensMetaContrato = c.imagensMeta || (c.processosMeta*c.folhasMedia);
  const totalMeses = Math.max(1, Number(c.duracaoAnos||4)*12);
  const metaMensal = imagensMetaContrato/totalMeses;
  const evol = await contratoMesesProducao();
  const maxEvol = Math.max(1, metaMensal, ...evol.map(e=>e.total));

  const t = state.arqgerTotais;
  const pContrato = pct(state.contratoTotais.arquivos, imagensMetaContrato);
  const pEnviado = pct(t.enviados, imagensMetaContrato);
  const pPago = pct(t.pagos, imagensMetaContrato);

  return `
  <div class="section-title"><h2>Linha do tempo do contrato TJRJ — ${c.dataInicio?new Date(c.dataInicio+"T00:00:00").toLocaleDateString('pt-BR'):'início não definido'} + ${c.duracaoAnos} anos</h2>${statusStamp(pContrato)}</div>
  <div class="grid cards">
    <div class="card acc-brass"><h3>Digitalizado (total)</h3><div class="big">${fmt(state.contratoTotais.arquivos)}</div><div class="small">${Math.round(pContrato)}% de ${fmt(imagensMetaContrato)}</div>${progressBar(pContrato)}</div>
    <div class="card acc-blue"><h3>Enviado ao ArqGer (total)</h3><div class="big">${fmt(t.enviados)}</div><div class="small">${Math.round(pEnviado)}% de ${fmt(imagensMetaContrato)}</div>${progressBar(pEnviado)}</div>
    <div class="card acc-green"><h3>Pago (total)</h3><div class="big">${fmt(t.pagos)}</div><div class="small">${Math.round(pPago)}% de ${fmt(imagensMetaContrato)}</div>${progressBar(pPago)}</div>
  </div>

  <div class="section-title"><h2>Evolução mensal desde o início do contrato</h2></div>
  <div class="card" style="padding:20px 16px 10px;overflow-x:auto;">
    <div style="display:flex;align-items:flex-end;gap:14px;height:150px;min-width:${evol.length*64}px;">
      ${evol.map(e=>{
        const acimaMeta = e.total >= metaMensal;
        return `
        <div style="flex:none;width:50px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
          <div class="mono" style="font-size:10.5px;color:var(--ink-soft);margin-bottom:4px;">${fmt(e.total)}</div>
          <div style="width:100%;background:${acimaMeta?'var(--green)':'var(--coral)'};border-radius:6px 6px 0 0;height:${Math.max(4,(e.total/maxEvol)*100)}%;"></div>
          <div style="font-size:10.5px;color:var(--ink-faint);margin-top:6px;">${monthLabel(e.mk)}</div>
        </div>`;}).join('')}
    </div>
    <div class="footnote">Meta de referência por mês: ${fmt(Math.round(metaMensal))} imagens (${fmt(imagensMetaContrato)} ÷ ${totalMeses} meses). Verde = acima da meta do mês, laranja = abaixo.</div>
  </div>

  <div class="section-title"><h2>Funil de faturamento ArqGer (acumulado)</h2></div>
  <div class="card">
    ${[

// ---------- ARQGER (FATURAMENTO) ----------
async function renderArqger(){
  const mk = refMonth;

  const aprovRows = aprov.slice().sort((a,b)=>b.data.localeCompare(a.data));
  const t = state.arqgerTotais;
  const imagensMetaContrato = state.contratoTJRJ.imagensMeta || (state.contratoTJRJ.processosMeta*state.contratoTJRJ.folhasMedia);
  const faltamEnviar = Math.max(0, imagensMetaContrato - t.enviados);
  const faltamPagar = Math.max(0, imagensMetaContrato - t.pagos);
  const pEnviado = pct(t.enviados, imagensMetaContrato);
  const pPago = pct(t.pagos, imagensMetaContrato);
  const consertoPct = t.enviados? Math.round((t.consertos/t.enviados)*100):0;
  const enviadoHoje = envio.filter(r=>r.data===todayStr).reduce((s,r)=>s+Number(r.arquivos||0),0);

  const aprovadoMes = aprovRows.reduce((s,r)=>s+Number(r.aprovados||0),0);
  const consertoMes = aprovRows.reduce((s,r)=>s+Number(r.consertos||0),0);

  const defEnvio = lastDefaults.envio;
  const defAprov = lastDefaults.aprovacoes;

  const nfDoMes = state.nfFechamentos.find(f=>f.mes===mk);

  return `

  <div class="card acc-blue" style="margin-bottom:14px">
    <h3>Imagens enviadas</h3>
    <div class="big">${fmt(t.enviados)} <span class="muted" style="font-size:14px">/ ${fmt(imagensMetaContrato)}</span></div>
    ${progressBar(pEnviado)}
    <div class="small">${Math.round(pEnviado)}% do contrato já enviado · faltam enviar ${fmt(faltamEnviar)} imagens</div>
  </div>
  <div class="grid cards">
    <div class="card acc-teal"><h3>Enviado hoje</h3><div class="big">${fmt(enviadoHoje)}</div><div class="small">meta dia: ${fmt(state.metaArqger.diaria)}</div></div>
    <div class="card acc-teal"><h3>Enviado em ${monthLabel(mk)}</h3><div class="big">${fmt(enviadoMes)}</div><div class="small">meta mês: ${fmt(state.metaArqger.mensal)}</div></div>
    <div class="card acc-coral"><h3>NIDs / processos enviados</h3><div class="big">${fmt(t.nids)}</div><div class="small">cada NID corresponde a 1 processo</div></div>
    <div class="card acc-red"><h3>Em conserto (acumulado)</h3><div class="big">${fmt(t.consertos)}</div><div class="small">${consertoPct}% do enviado</div></div>
  </div>

  <div class="section-title"><h2>1 · Lançar envio diário ao ArqGer</h2></div>
  <div class="footnote" style="margin:-4px 0 10px">Só o volume enviado — sem aprovação e sem caixas referentes, que agora são registradas à parte.</div>
  <form class="entryform" id="form-envio">
    <div><label>Data</label><input type="date" name="data" value="${defEnvio.data||todayStr}" required></div>
    <div><label>Responsável (opcional)</label><input type="text" name="responsavel" value="${defEnvio.responsavel||''}" placeholder="quem enviou"></div>
    <div><label>Arquivos enviados (imagens)</label><input type="number" name="arquivos" min="0" required></div>
    <div><label>NIDs enviados (processos)</label><input type="number" name="nids" min="0"></div>
    <div><button class="btn" type="submit">Lançar envio</button></div>
  </form>
  <div class="tablewrap" style="margin-bottom:20px">
  <table>
    <thead><tr><th>Data</th><th>Responsável</th><th class="num">Arquivos</th><th class="num">NIDs</th><th></th></tr></thead>
    <tbody>
    ${rows.length?rows.map(r=>`
      <tr>
        <td>${r.data.split('-').reverse().join('/')}</td>
        <td>${r.responsavel||'-'}</td>
        <td class="num">${fmt(r.arquivos)}</td>
        <td class="num">${fmt(r.nids)}</td>
        <td><button class="btn ghost" data-del-envio="${r.id}">Excluir</button></td>
      </tr>`).join(''):`<tr><td colspan="5" class="empty">Nenhum envio lançado em ${monthLabel(mk)} ainda.</td></tr>`}
    </tbody>
  </table>
  </div>

  <div class="section-title"><h2>2 · Aprovação para pagamento</h2></div>

        <td>${r.data.split('-').reverse().join('/')}</td>

        <td class="num">${fmt(r.consertos)}</td>
        <td><button class="btn ghost" data-del-aprov="${r.id}">Excluir</button></td>
      </tr>`).join(''):`<tr><td colspan="5" class="empty">Nenhuma aprovação lançada em ${monthLabel(mk)} ainda.</td></tr>`}
    </tbody>
  </table>
  </div>

  <div class="section-title"><h2>3 · Pagamento e Nota Fiscal — fechamento mensal</h2></div>
  <div class="card acc-brass" style="margin-bottom:14px">
    <h3>Total já pago (acumulado)</h3>
    <div class="big">${fmt(t.pagos)} <span class="muted" style="font-size:14px">/ ${fmt(imagensMetaContrato)}</span></div>
    ${progressBar(pPago)}

  </div>
  ${nfDoMes?`<div class="card acc-green" style="margin-bottom:14px"><h3>Faturamento de ${monthLabel(mk)} já fechado</h3><div class="big">${fmt(nfDoMes.imagensPagas)} imagens</div><div class="small">NF nº ${nfDoMes.numeroNF||'-'} · fechado em ${nfDoMes.dataFechamento}</div></div>`:`
  <form class="entryform" id="form-nf">
    <div><label>Mês de referência</label><input type="text" value="${monthLabel(mk)}" disabled></div>
    <div><label>Imagens pagas no mês</label><input type="number" name="imagensPagas" min="0" value="${aprovadoMes||''}" required></div>

  <div class="footnote">Campo pré-preenchido com o total já aprovado no mês — ajuste se necessário antes de fechar. Feche até o dia 30 de cada mês.</div>`}

  ${nfOrdenados.length?`
  <div class="section-title"><h2>Histórico de fechamentos de NF</h2></div>
  <div class="tablewrap">
  <table>
    <thead><tr><th>Mês</th><th class="num">Imagens pagas</th><th>Nº NF</th><th>Fechado em</th></tr></thead>
    <tbody>
    ${nfOrdenados.map(f=>`<tr><td>${monthLabel(f.mes)}</td><td class="num">${fmt(f.imagensPagas)}</td><td>${f.numeroNF||'-'}</td><td>${f.dataFechamento}</td></tr>`).join('')}
    </tbody>
  </table>
  </div>`:''}
  <div class="footnote">Fluxo: 1) envio diário ao ArqGer · 2) aprovação (ou conserto) lançada separadamente, à medida que sai · 3) no fim do mês, some as aprovações e feche a Nota Fiscal. O envio ao NAS é apenas backup interno e fica em aba própria.</div>`;
}

}

// ---------- HISTÓRICO POR OPERADOR ----------
async function renderHistorico(){
  const selectedOpId = window.__historicoOpId || '';
  const rangeMeses = window.__historicoRange || 12;
  const opts = state.operadores.map(o=>`<option value="${o.id}" ${o.id===selectedOpId?'selected':''}>${o.nome} (${o.funcao})</option>`).join('');
  let bodyHtml = '<div class="empty">Selecione um operador para ver o histórico de produção mês a mês.</div>';
  window.__historicoData = null;
  const op = state.operadores.find(o=>o.id===selectedOpId);
  if(op){
    const rows = [];
    for(let i=rangeMeses-1;i>=0;i--){
      const mk = shiftMonth(refMonth, -i);
      let total=0, meta=0;
      if(op.funcao==='Digitalizador'){
        const arr = await getMonthArr('producao', mk);
        const regs = arr.filter(p=>p.operadorId===op.id);
        total = regs.reduce((s,p)=>s+Number(p.arquivos||0),0);
        meta = regs.reduce((s,p)=>s+metaDoDia(op,p),0);
      } else if(op.funcao==='Higienizador'){
        const arr = await getMonthArr('higienizacao', mk);
        const regs = arr.filter(h=>h.operadorId===op.id);
        total = regs.reduce((s,h)=>s+Number(h.caixas||0),0);
        meta = regs.reduce((s,h)=>s+(h.metaManual?Number(h.metaManual):state.metaHigienizacao),0);
      } else {
        const arr = await getMonthArr('qualidade', mk);
        const regs = arr.filter(q=>q.operadorId===op.id);
        total = regs.reduce((s,q)=>s+Number(q.finalizados||0),0);
        meta = regs.reduce((s,q)=>s+(q.metaManual?Number(q.metaManual):state.metaQualidade.finalizados),0);
      }
      rows.push({mk, total, meta, p: pct(total, meta||1)});
    }
    window.__historicoData = {
      opNome: op.nome,
      headers: ['Mês','Total','Meta','%'],
      rows: rows.map(r=>[monthLabel(r.mk), r.total, r.meta, r.meta?Math.round(r.p)+'%':''])
    };
    const maxTotal = Math.max(1, ...rows.map(r=>r.total), ...rows.map(r=>r.meta));
    bodyHtml = `
    <div class="section-title"><h2>${op.nome} — ${op.funcao}</h2></div>
    <div class="card" style="padding:20px 16px 10px;overflow-x:auto;margin-bottom:16px;">
      <div style="display:flex;align-items:flex-end;gap:10px;height:150px;min-width:${rows.length*54}px;">
        ${rows.map(r=>`
        <div style="flex:none;width:42px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
          <div class="mono" style="font-size:10px;color:var(--ink-soft);margin-bottom:4px;">${fmt(r.total)}</div>
          <div style="width:100%;background:${barColor(statusInfo(r.p).cls)};border-radius:6px 6px 0 0;height:${Math.max(4,(r.total/maxTotal)*100)}%;"></div>
          <div style="font-size:10px;color:var(--ink-faint);margin-top:6px;">${monthLabel(r.mk)}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="tablewrap">
    <table>
      <thead><tr><th>Mês</th><th class="num">Total</th><th class="num">Meta</th><th class="num">%</th><th>Status</th></tr></thead>
      <tbody>
      ${rows.map(r=>`<tr><td>${monthLabel(r.mk)}</td><td class="num">${fmt(r.total)}</td><td class="num">${fmt(r.meta)}</td><td class="num">${r.meta?Math.round(r.p)+'%':'-'}</td><td>${statusStamp(r.p)}</td></tr>`).join('')}
      </tbody>
    </table>
    </div>`;
  }
  return `
  <div class="section-title"><h2>Histórico de produção por operador</h2></div>
  <div class="footnote" style="margin:0 0 10px">Veja quanto um operador produziu mês a mês — mês passado, retrasado, e assim por diante, até 5 anos atrás.</div>
  <form class="entryform" id="form-historico" style="margin-bottom:20px;">
    <div><label>Operador</label><select name="operadorId">${state.operadores.length?'<option value="">Selecione…</option>'+opts:'<option value="">Cadastre um operador</option>'}</select></div>
    <div><label>Período</label><select name="range">
      <option value="6" ${rangeMeses===6?'selected':''}>Últimos 6 meses</option>
      <option value="12" ${rangeMeses===12?'selected':''}>Últimos 12 meses</option>
      <option value="24" ${rangeMeses===24?'selected':''}>Últimos 2 anos</option>
      <option value="36" ${rangeMeses===36?'selected':''}>Últimos 3 anos</option>
      <option value="48" ${rangeMeses===48?'selected':''}>Últimos 4 anos</option>
      <option value="60" ${rangeMeses===60?'selected':''}>Últimos 5 anos</option>
    </select></div>
    <div><button class="btn" type="submit">Ver histórico</button></div>
  </form>
  ${bodyHtml}
  `;
}

// ---------- FECHAMENTO ----------
async function renderFechamento(){
  const mk = refMonth;
  const prod = await getMonthArr('producao', mk);
  const hig = await getMonthArr('higienizacao', mk);
  const qual = await getMonthArr('qualidade', mk);
  const envio = await getMonthArr('envio', mk);
  const aprov = await getMonthArr('aprovacoes', mk);
  const nas = await getMonthArr('nas', mk);
  const jaFechado = state.fechamentos.find(f=>f.mes===mk);

  const porOperador = state.operadores.map(op=>{
    let total=0, meta=0, extra={};
    if(op.funcao==='Digitalizador'){
      const regs = prod.filter(p=>p.operadorId===op.id);
      total = regs.reduce((s,p)=>s+Number(p.arquivos||0),0);
      meta = regs.reduce((s,p)=>s+metaDoDia(op,p),0);
      extra.caixas = regs.reduce((s,p)=>s+Number(p.caixas||0),0);
      extra.nid = regs.reduce((s,p)=>s+Number(p.nid||0),0);
    } else if(op.funcao==='Higienizador'){
      const regs = hig.filter(h=>h.operadorId===op.id);
      total = regs.reduce((s,h)=>s+Number(h.caixas||0),0);
      meta = regs.reduce((s,h)=>s+(h.metaManual?Number(h.metaManual):state.metaHigienizacao),0);
    } else {
      const regs = qual.filter(q=>q.operadorId===op.id);
      total = regs.reduce((s,q)=>s+Number(q.finalizados||0),0);
      meta = regs.reduce((s,q)=>s+(q.metaManual?Number(q.metaManual):state.metaQualidade.finalizados),0);
    }
    return {op, total, meta, extra, p: pct(total,meta||1)};
  }).filter(r=>r.meta>0 || r.total>0);

  const envioMes = envio.reduce((s,e)=>s+Number(e.arquivos||0),0);
  const aprovadosMes = aprov.reduce((s,a)=>s+Number(a.aprovados||0),0);
  const nfDoMesFech = state.nfFechamentos.find(f=>f.mes===mk);
  const pagosMes = nfDoMesFech ? Number(nfDoMesFech.imagensPagas||0) : 0;
  const nasMes = nas.reduce((s,e)=>s+Number(e.arquivos||0),0);

  return `
  <div class="section-title"><h2>Relatório mensal — ${monthLabel(mk)}</h2>
    ${jaFechado?`<span class="stamp green">Mês fechado</span>`:`<button class="btn" id="btn-fechar-mes">Fechar mês</button>`}
  </div>
  <div class="footnote" style="margin:-4px 0 12px">Clique em "🖨️ Imprimir mês" na barra acima, com esta aba aberta, para gerar o relatório completo do período: produção por operador, envio/aprovação ArqGer e situação da Nota Fiscal.</div>
  <div class="tablewrap">
  <table>
    <thead><tr><th>Operador</th><th>Função</th><th class="num">Total</th><th class="num">Meta</th><th class="num">%</th><th>Status</th></tr></thead>
    <tbody>
    ${porOperador.length?porOperador.map(r=>`
      <tr>
        <td>${r.op.nome}</td>
        <td>${r.op.funcao}</td>
        <td class="num">${fmt(r.total)}</td>
        <td class="num">${fmt(r.meta)}</td>
        <td class="num">${Math.round(r.p)}%</td>
        <td>${statusStamp(r.p)}</td>
      </tr>`).join(''):'<tr><td colspan="6" class="empty">Sem lançamentos neste mês.</td></tr>'}
    </tbody>
  </table>
  </div>
  <div class="divider"></div>
  <div class="grid cards">
    <div class="card acc-blue"><h3>Enviado ArqGer no mês</h3><div class="big">${fmt(envioMes)}</div></div>
    <div class="card acc-green"><h3>Aprovados no mês</h3><div class="big">${fmt(aprovadosMes)}</div></div>
    <div class="card acc-brass"><h3>Pagos no mês (NF)</h3><div class="big">${fmt(pagosMes)}</div>${nfDoMesFech?`<div class="small">NF nº ${nfDoMesFech.numeroNF||'-'} · fechado em ${nfDoMesFech.dataFechamento}</div>`:`<div class="small">faturamento ainda não fechado</div>`}</div>
    <div class="card acc-teal"><h3>Backup NAS no mês</h3><div class="big">${fmt(nasMes)}</div></div>
  </div>
  ${state.fechamentos.length?`
  <div class="section-title"><h2>Meses fechados</h2></div>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th>Data do fechamento</th></tr></thead><tbody>
  ${state.fechamentos.slice().sort((a,b)=>b.mes.localeCompare(a.mes)).map(f=>`<tr><td>${monthLabel(f.mes)}</td><td>${f.dataFechamento}</td></tr>`).join('')}
  </tbody></table></div>`:''}
  `;
}

// ---------- HANDLERS ----------
function bindHandlers(){
  const main = document.getElementById('main');

  const formProd = document.getElementById('form-prod');
  if(formProd) formProd.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formProd);
    const entry = {
      id: uid(), operadorId: fd.get('operadorId'), data: fd.get('data'),
      scanner: fd.get('scanner'), arquivos: Number(fd.get('arquivos')||0),
      caixas: Number(fd.get('caixas')||0), nid: Number(fd.get('nid')||0),
      horas: fd.get('horas')?Number(fd.get('horas')):null,
      metaManual: fd.get('metaManual')?Number(fd.get('metaManual')):null,
      obs: fd.get('obs')||''
    };
    if(!entry.operadorId){ toast('Cadastre um operador primeiro.'); return; }
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('producao', mk);
    arr.push(entry);
    await saveMonthArr('producao', mk);
    state.contratoTotais.arquivos += entry.arquivos;
    state.contratoTotais.caixas += entry.caixas;
    state.contratoTotais.nid += entry.nid;
    await persistContrato();
    lastDefaults.producao = {operadorId: entry.operadorId, data: entry.data, scanner: entry.scanner};
    toast('Produção lançada.');
    render();
  };

  const formEnvio = document.getElementById('form-envio');
  if(formEnvio) formEnvio.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formEnvio);
    const entry = {id:uid(), data:fd.get('data'), responsavel:fd.get('responsavel')||'',
      arquivos:Number(fd.get('arquivos')||0), nids:Number(fd.get('nids')||0)};
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('envio', mk);
    arr.push(entry);
    await saveMonthArr('envio', mk);
    state.arqgerTotais.enviados += entry.arquivos;
    state.arqgerTotais.nids += entry.nids;
    await persistArqgerTotais();
    lastDefaults.envio = {data: entry.data, responsavel: entry.responsavel};
    toast('Envio lançado.');
    render();
  };

  const formAprov = document.getElementById('form-aprovacao');
  if(formAprov) formAprov.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formAprov);
    const entry = {id:uid(), data:fd.get('data'), responsavel:fd.get('responsavel')||'',
      aprovados:Number(fd.get('aprovados')||0), consertos:Number(fd.get('consertos')||0)};
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('aprovacoes', mk);
    arr.push(entry);
    await saveMonthArr('aprovacoes', mk);
    state.arqgerTotais.aprovados += entry.aprovados;
    state.arqgerTotais.consertos += entry.consertos;
    await persistArqgerTotais();
    lastDefaults.aprovacoes = {data: entry.data, responsavel: entry.responsavel};
    toast('Aprovação lançada.');
    render();
  };

  const formNF = document.getElementById('form-nf');
  if(formNF) formNF.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formNF);
    const fechamento = {
      mes: refMonth,
      imagensPagas: Number(fd.get('imagensPagas')||0),
      numeroNF: fd.get('numeroNF')||'',
      dataFechamento: fd.get('dataFechamento')||todayStr
    };
    state.nfFechamentos.push(fechamento);
    state.arqgerTotais.pagos += fechamento.imagensPagas;
    await persistNF();
    await persistArqgerTotais();
    toast('Faturamento do mês fechado.');
    render();
  };

  const formNas = document.getElementById('form-nas');
  if(formNas) formNas.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formNas);
    const entry = {id:uid(), data:fd.get('data'), responsavel:fd.get('responsavel')||'', arquivos:Number(fd.get('arquivos')||0)};
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('nas', mk);
    arr.push(entry);
    await saveMonthArr('nas', mk);
    toast('Backup lançado.');
    render();
  };

  const formHig = document.getElementById('form-hig');
  if(formHig) formHig.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formHig);
    if(!fd.get('operadorId')){ toast('Cadastre um higienizador primeiro.'); return; }
    const entry = {id:uid(), operadorId:fd.get('operadorId'), data:fd.get('data'), caixas:Number(fd.get('caixas')||0), metaManual: fd.get('metaManual')?Number(fd.get('metaManual')):null};
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('higienizacao', mk);
    arr.push(entry);
    await saveMonthArr('higienizacao', mk);
    lastDefaults.higienizacao = {operadorId: entry.operadorId, data: entry.data};
    toast('Higienização lançada.');
    render();
  };

  const formQual = document.getElementById('form-qual');
  if(formQual) formQual.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formQual);
    if(!fd.get('operadorId')){ toast('Cadastre um operador de qualidade primeiro.'); return; }
    const entry = {id:uid(), operadorId:fd.get('operadorId'), data:fd.get('data'),
      arquivosQC:Number(fd.get('arquivosQC')||0), finalizados:Number(fd.get('finalizados')||0),
      certificado:Number(fd.get('certificado')||0), ocerizado:Number(fd.get('ocerizado')||0),
      pdfA:Number(fd.get('pdfA')||0), metaManual: fd.get('metaManual')?Number(fd.get('metaManual')):null};
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('qualidade', mk);
    arr.push(entry);
    await saveMonthArr('qualidade', mk);
    lastDefaults.qualidade = {operadorId: entry.operadorId, data: entry.data};
    toast('Controle de qualidade lançado.');
    render();
  };

  const formHistorico = document.getElementById('form-historico');
  if(formHistorico) formHistorico.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(formHistorico);
    window.__historicoOpId = fd.get('operadorId')||'';
    window.__historicoRange = Number(fd.get('range')||12);
    render();
  };

  const funcaoSelect = document.getElementById('funcao-select');
  if(funcaoSelect) funcaoSelect.onchange = ()=>{
    const sf = document.getElementById('scanner-field');
    const vf = document.getElementById('servidor-field');
    if(sf) sf.style.display = funcaoSelect.value==='Digitalizador' ? '' : 'none';
    if(vf) vf.style.display = funcaoSelect.value==='Controle de Qualidade' ? '' : 'none';
  };

  const formOp = document.getElementById('form-op');
  if(formOp) formOp.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formOp);
    const funcao = fd.get('funcao');
    const op = {id:uid(), nome:fd.get('nome'), contato:fd.get('contato')||'', funcao:funcao,
      scanner: funcao==='Digitalizador'?fd.get('scanner'):null,
      servidor: funcao==='Controle de Qualidade'?fd.get('servidor'):null,
      ativo:true, dataCriacao: todayStr};
    state.operadores.push(op);
    await persistOperadores();
    toast('Operador cadastrado.');
    render();
  };

  main.querySelectorAll('[data-change-scanner]').forEach(sel=>{
    sel.onchange = async ()=>{
      const op = state.operadores.find(o=>o.id===sel.dataset.changeScanner);
      op.scanner = sel.value;
      await persistOperadores();
      toast('Escâner atualizado.');
    };
  });
  main.querySelectorAll('[data-change-servidor]').forEach(sel=>{
    sel.onchange = async ()=>{
      const op = state.operadores.find(o=>o.id===sel.dataset.changeServidor);
      op.servidor = sel.value;
      await persistOperadores();
      toast('Servidor atualizado.');
    };
  });
  main.querySelectorAll('[data-deactivate]').forEach(b=>{
    b.onclick = async ()=>{
      const op = state.operadores.find(o=>o.id===b.dataset.deactivate);
      op.ativo = false; op.dataDesativacao = todayStr;
      await persistOperadores(); toast('Operador desativado.'); render();
    };
  });
  main.querySelectorAll('[data-reactivate]').forEach(b=>{
    b.onclick = async ()=>{
      const op = state.operadores.find(o=>o.id===b.dataset.reactivate);
      op.ativo = true; op.dataDesativacao = null;
      await persistOperadores(); toast('Operador reativado.'); render();
    };
  });
  main.querySelectorAll('[data-remove]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Excluir definitivamente este operador do cadastro? O histórico de produção lançado permanece.')) return;
      state.operadores = state.operadores.filter(o=>o.id!==b.dataset.remove);
      await persistOperadores(); toast('Operador excluído.'); render();
    };
  });

  main.querySelectorAll('[data-del-prod]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('producao', mk);
      const removed = arr.find(p=>p.id===b.dataset.delProd);
      monthCache.producao[mk] = arr.filter(p=>p.id!==b.dataset.delProd);
      await saveMonthArr('producao', mk);
      if(removed){
        state.contratoTotais.arquivos = Math.max(0, state.contratoTotais.arquivos - Number(removed.arquivos||0));
        state.contratoTotais.caixas = Math.max(0, state.contratoTotais.caixas - Number(removed.caixas||0));
        state.contratoTotais.nid = Math.max(0, state.contratoTotais.nid - Number(removed.nid||0));
        await persistContrato();
      }
      render();
    };
  });
  main.querySelectorAll('[data-del-envio]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('envio', mk);
      const removed = arr.find(p=>p.id===b.dataset.delEnvio);
      monthCache.envio[mk] = arr.filter(p=>p.id!==b.dataset.delEnvio);
      await saveMonthArr('envio', mk);
      if(removed){
        state.arqgerTotais.enviados = Math.max(0, state.arqgerTotais.enviados - Number(removed.arquivos||0));
        state.arqgerTotais.nids = Math.max(0, state.arqgerTotais.nids - Number(removed.nids||0));
        await persistArqgerTotais();
      }
      render();
    };
  });
  main.querySelectorAll('[data-del-aprov]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('aprovacoes', mk);
      const removed = arr.find(p=>p.id===b.dataset.delAprov);
      monthCache.aprovacoes[mk] = arr.filter(p=>p.id!==b.dataset.delAprov);
      await saveMonthArr('aprovacoes', mk);
      if(removed){
        state.arqgerTotais.aprovados = Math.max(0, state.arqgerTotais.aprovados - Number(removed.aprovados||0));
        state.arqgerTotais.consertos = Math.max(0, state.arqgerTotais.consertos - Number(removed.consertos||0));
        await persistArqgerTotais();
      }
      render();
    };
  });
  main.querySelectorAll('[data-del-nas]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('nas', mk);
      monthCache.nas[mk] = arr.filter(p=>p.id!==b.dataset.delNas);
      await saveMonthArr('nas', mk); render();
    };
  });
  main.querySelectorAll('[data-del-hig]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('higienizacao', mk);
      monthCache.higienizacao[mk] = arr.filter(p=>p.id!==b.dataset.delHig);
      await saveMonthArr('higienizacao', mk); render();
    };
  });
  main.querySelectorAll('[data-del-qual]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('qualidade', mk);
      monthCache.qualidade[mk] = arr.filter(p=>p.id!==b.dataset.delQual);
      await saveMonthArr('qualidade', mk); render();
    };
  });

  const formContrato = document.getElementById('form-contrato');
  if(formContrato) formContrato.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formContrato);
    state.contratoTJRJ = {
      nome: fd.get('nome')||'Contrato',
      processosMeta: Number(fd.get('processosMeta')||0),
      folhasMedia: Number(fd.get('folhasMedia')||0),
      imagensMeta: Number(fd.get('imagensMeta')||0),
      dataInicio: fd.get('dataInicio')||'',
      duracaoAnos: Number(fd.get('duracaoAnos')||4)
    };
    await persistContrato();
    toast('Dados do contrato salvos.');
    render();
  };

  const formMetasScanner = document.getElementById('form-metas-scanner');
  if(formMetasScanner) formMetasScanner.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formMetasScanner);
    SCANNERS.forEach(s=>{
      state.metasScanner[s] = {diaria:Number(fd.get('d-'+s)||0), hora:Number(fd.get('h-'+s)||0)};
    });
    await persistMetas(); toast('Metas de escâner salvas.'); render();
  };
  const formMetasOutras = document.getElementById('form-metas-outras');
  if(formMetasOutras) formMetasOutras.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formMetasOutras);
    state.metaHigienizacao = Number(fd.get('metaHig')||0);
    state.metaQualidade = {qc:Number(fd.get('metaQC')||0), finalizados:Number(fd.get('metaFin')||0)};
    await persistMetas(); toast('Metas salvas.'); render();
  };
  const formMetasArqger = document.getElementById('form-metas-arqger');
  if(formMetasArqger) formMetasArqger.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formMetasArqger);
    state.metaArqger = {diaria:Number(fd.get('d')||0), semanal:Number(fd.get('s')||0), mensal:Number(fd.get('m')||0)};
    await persistMetas(); toast('Metas de envio salvas.'); render();
  };
  const formThresholds = document.getElementById('form-thresholds');
  if(formThresholds) formThresholds.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formThresholds);
    state.thresholds = {baixa:Number(fd.get('baixa')||0), media:Number(fd.get('media')||0), boa:Number(fd.get('boa')||0)};
    await persistMetas(); toast('Faixas de status salvas.'); render();
  };

  const btnFechar = document.getElementById('btn-fechar-mes');
  if(btnFechar) btnFechar.onclick = async ()=>{
    if(!confirm('Fechar o mês de '+monthLabel(refMonth)+'? Isso marca o período como encerrado para conferência.')) return;
    state.fechamentos.push({mes:refMonth, dataFechamento: todayStr.split('-').reverse().join('/')});
    await saveJSON('sp-fechamentos', state.fechamentos);
    toast('Mês fechado.'); render();
  };
}

(async function init(){
  const logoImg = document.getElementById('logo-img');
  if(logoImg) logoImg.src = 'data:image/png;base64,'+LOGO_B64;
  await loadAll();
  setCloudStatus('ok');
  render();
})();
</script>
</body>
</html>
