<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Produção · Tempo Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F0E4; --card:#FFFFFF; --ink:#2A2620; --ink-soft:#6B6459; --ink-faint:#96907F;
  --brass:#B9791E; --brass-dark:#8A5A15; --brass-bg:#FBE8C8;
  --line:#E2DCCB; --line-strong:#CFC6AC;
  --red:#C0392B; --red-bg:#FBE3DF; --red-line:#EEB3A8;
  --amber:#C17F0A; --amber-bg:#FCEFCB; --amber-line:#F0CE81;
  --green:#1F8A57; --green-bg:#DEF3E7; --green-line:#A6DEBF;
  --blue:#1F6FA8; --blue-bg:#DDEDF9; --blue-line:#A2CDEA;
  --purple:#6E4DB0; --purple-bg:#EBE3F8; --purple-line:#C5AEE8;
  --teal:#12897A; --teal-bg:#DBF2EE; --teal-line:#96D9CC;
  --coral:#D65B3A; --coral-bg:#FCE6DD; --coral-line:#F0B49B;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.45;}
h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:600;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{max-width:1180px;margin:0 auto;padding:0 0 80px;}
header.top{padding:16px 20px;background:var(--ink);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header.top .brandline{display:flex;align-items:center;gap:14px;}
header.top .logo{height:34px;display:block;background:#fff;padding:4px 8px;border-radius:6px;}
header.top h1{font-size:19px;letter-spacing:.2px;color:#fff;}
header.top .sub{font-size:12.5px;color:#D8CFB8;}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 20px;background:var(--paper);position:sticky;top:0;z-index:20;border-bottom:2px solid var(--line-strong);}
nav.tabs button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;}
nav.tabs button .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
nav.tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
main{padding:20px;}
.grid{display:grid;gap:14px;}
.cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:var(--radius);padding:16px;}
.card.acc-brass{border-left-color:var(--brass);}
.card.acc-blue{border-left-color:var(--blue);}
.card.acc-teal{border-left-color:var(--teal);}
.card.acc-green{border-left-color:var(--green);}
.card.acc-purple{border-left-color:var(--purple);}
.card.acc-coral{border-left-color:var(--coral);}
.card.acc-red{border-left-color:var(--red);}
.card h3{font-size:14px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
.card .big{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}
.card .small{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.scanner-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;}
.scanner-chip.SV600{background:var(--teal-bg);color:var(--teal);}
.scanner-chip.ViisanTR{background:var(--purple-bg);color:var(--purple);}
.scanner-chip.CamerasTR{background:var(--coral-bg);color:var(--coral);}
.scanner-chip.ScannerTeck{background:var(--blue-bg);color:var(--blue);}
.scanner-chip.Servidor1{background:var(--amber-bg);color:var(--amber);}
.scanner-chip.Servidor2{background:var(--green-bg);color:var(--green);}
.section-title h2{border-left:4px solid var(--brass);padding-left:10px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px;}
.section-title h2{font-size:17px;}
.stamp{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;border:2px solid;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;transform:rotate(-2deg);}
.stamp.red{color:var(--red);border-color:var(--red);background:var(--red-bg);}
.stamp.amber{color:var(--amber);border-color:var(--amber);background:var(--amber-bg);}
.stamp.green{color:var(--green);border-color:var(--green);background:var(--green-bg);}
.stamp.blue{color:var(--blue);border-color:var(--blue);background:var(--blue-bg);}
.stamp.gray{color:var(--ink-faint);border-color:var(--line-strong);background:var(--paper);transform:rotate(0);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);}
th{color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;}
tr:hover td{background:#FBFAF6;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 12px;overflow-x:auto;}
form.entryform{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end;margin-bottom:16px;}
label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
input,select{width:100%;padding:8px 9px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;font-size:13.5px;font-family:'Inter',sans-serif;color:var(--ink);}
input:focus,select:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass);}
button.btn{padding:9px 16px;border-radius:7px;border:1px solid var(--brass);background:var(--brass);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;}
button.btn.secondary{background:var(--card);color:var(--brass-dark);}
button.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink-soft);}
button.btn.danger{background:var(--red);border-color:var(--red);}
button.btn:hover{opacity:.9;}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.bar-outer{width:100%;height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px;}
.bar-inner{height:100%;border-radius:99px;}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--brass-bg);color:var(--brass-dark);font-weight:600;}
.opheader{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.muted{color:var(--ink-faint);font-size:12px;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.badgebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.empty{padding:26px;text-align:center;color:var(--ink-faint);font-size:13px;}
.op-status-row{display:flex;align-items:center;gap:8px;}
select[multiple]{height:auto;}
.footnote{font-size:11px;color:var(--ink-faint);margin-top:6px;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;}
@media(max-width:640px){
  nav.tabs{padding:8px 10px;}
  main{padding:12px;}
  form.entryform{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brandline">
      <img class="logo" id="logo-img" alt="Tempo Real">
      <div>
        <h1>Sistema de Produção</h1>
        <span class="sub mono" id="hoje-label"></span>
        <span class="sub mono" id="cloud-status" style="margin-left:10px;">☁️ conectando…</span>
      </div>
    </div>
    <div class="sub">Tempo Real Produção e Comunicação</div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

function monthKey(d){ return d.slice(0,7); }
function weekRange(d){
  const dt = new Date(d+"T00:00:00");
  const day = (dt.getDay()+6)%7;
  const monday = new Date(dt); monday.setDate(dt.getDate()-day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return {start: monday.toISOString().slice(0,10), end: sunday.toISOString().slice(0,10)};
}
function inRange(d,s,e){ return d>=s && d<=e; }

async function loadJSON(key, fallback){
  try{
    const ref = doc(db, FIRESTORE_COLLECTION, key);
    const snap = await getDoc(ref);
    return snap.exists() ? snap.data().value : fallback;
  }catch(e){
    console.error('Firestore load error ['+key+']', e);
    setCloudStatus('erro');
    return fallback;
  }
}
async function saveJSON(key, value){
  try{
    const ref = doc(db, FIRESTORE_COLLECTION, key);
    await setDoc(ref, {value, atualizadoEm: Date.now()});
    setCloudStatus('ok');
  }catch(e){
    console.error('Firestore save error ['+key+']', e);
    setCloudStatus('erro');
    toast('Erro ao salvar na nuvem. Verifique sua conexão.');
  }
}
function setCloudStatus(status){
  const el = document.getElementById('cloud-status');
  if(!el) return;
  if(status==='ok') el.innerHTML = '☁️ sincronizado';
  else if(status==='erro') el.innerHTML = '⚠️ erro de conexão com a nuvem';
  else el.innerHTML = '☁️ conectando…';
}
async function getMonthArr(type, mk){
  if(monthCache[type][mk]) return monthCache[type][mk];
  const arr = await loadJSON('sp-'+type+'-'+mk, []);
  monthCache[type][mk] = arr;
  return arr;
}
async function saveMonthArr(type, mk){
  await saveJSON('sp-'+type+'-'+mk, monthCache[type][mk]);
}

async function loadAll(){
  state.operadores = await loadJSON('sp-operadores', []);
  const metas = await loadJSON('sp-metas', null);
  if(metas) Object.assign(state, metas);
  state.fechamentos = await loadJSON('sp-fechamentos', []);
  const contrato = await loadJSON('sp-contrato', null);
  if(contrato){
    if(contrato.contratoTJRJ) state.contratoTJRJ = contrato.contratoTJRJ;
    if(contrato.contratoTotais) state.contratoTotais = contrato.contratoTotais;
  }
  const arqgerT = await loadJSON('sp-arqger-totais', null);
  if(arqgerT) state.arqgerTotais = Object.assign({enviados:0,nids:0,aprovados:0,consertos:0,pagos:0}, arqgerT);
  state.nfFechamentos = await loadJSON('sp-nf-fechamentos', []);
  await getMonthArr('producao', refMonth);
  await getMonthArr('envio', refMonth);
  await getMonthArr('nas', refMonth);
  await getMonthArr('higienizacao', refMonth);
  await getMonthArr('qualidade', refMonth);
}

function statusInfo(percent){
  const t = state.thresholds;
  if(percent < t.baixa) return {label:'Baixa', cls:'red'};
  if(percent < t.media) return {label:'Média', cls:'amber'};
  if(percent < t.boa) return {label:'Boa', cls:'green'};
  return {label:'Excelente', cls:'blue'};
}
function statusStamp(percent){
  const s = statusInfo(percent);
  return `<span class="stamp ${s.cls}">${s.label}</span>`;
}
function barColor(cls){
  return cls==='red'?'var(--red)':cls==='amber'?'var(--amber)':cls==='green'?'var(--green)':'var(--blue)';
}
function progressBar(percent){
  const s = statusInfo(percent);
  const w = Math.min(percent,130);
  return `<div class="bar-outer"><div class="bar-inner" style="width:${w}%;background:${barColor(s.cls)}"></div></div>`;
}

function metaDoDia(op, entry){
  if(op.funcao==='Digitalizador'){
    const base = state.metasScanner[entry && entry.scanner ? entry.scanner : op.scanner] || {diaria:0,hora:0};
    if(entry && entry.metaManual) return Number(entry.metaManual);
    if(entry && entry.horas) return Math.round(base.hora * Number(entry.horas));
    return base.diaria;
  }
  if(op.funcao==='Higienizador'){
    if(entry && entry.metaManual) return Number(entry.metaManual);
    return state.metaHigienizacao;
  }
  if(op.funcao==='Controle de Qualidade'){
    if(entry && entry.metaManual) return Number(entry.metaManual);
    return state.metaQualidade.finalizados;
  }
  return 0;
}

// ---------- CONTRATO TJRJ ----------
function diasUteisEntre(d1,d2){
  let count=0; const cur=new Date(d1+"T00:00:00"); const end=new Date(d2+"T00:00:00");
  while(cur<=end){ const wd=cur.getDay(); if(wd!==0 && wd!==6) count++; cur.setDate(cur.getDate()+1); }
  return count;
}
function renderContrato(){
  const c = state.contratoTJRJ;
  const t = state.contratoTotais;
  const imagensMeta = c.imagensMeta || (c.processosMeta * c.folhasMedia);
  const p = pct(t.arquivos, imagensMeta);
  const s = statusInfo(p);
  let prazoInfo = '';
  if(c.dataInicio){
    const inicio = new Date(c.dataInicio+"T00:00:00");
    const fim = new Date(inicio); fim.setFullYear(fim.getFullYear()+Number(c.duracaoAnos||4));
    const hojeDt = new Date(todayStr+"T00:00:00");
    const diasUteisTotais = diasUteisEntre(c.dataInicio, fim.toISOString().slice(0,10));
    const diasUteisRestantes = Math.max(0, diasUteisEntre(todayStr>c.dataInicio?todayStr:c.dataInicio, fim.toISOString().slice(0,10)));
    const restante = Math.max(0, imagensMeta - t.arquivos);
    const ritmoNecessario = diasUteisRestantes>0 ? Math.ceil(restante/diasUteisRestantes) : 0;
    const diasCorridosRestantes = Math.max(0, Math.round((fim-hojeDt)/(1000*60*60*24)));
    prazoInfo = `
    <div class="grid cards">
      <div class="card acc-brass"><h3>Prazo contratual</h3><div class="big">${fim.toLocaleDateString('pt-BR')}</div><div class="small">início em ${inicio.toLocaleDateString('pt-BR')} · ${diasCorridosRestantes} dias corridos restantes</div></div>
      <div class="card acc-blue"><h3>Ritmo necessário</h3><div class="big">${fmt(ritmoNecessario)}</div><div class="small">imagens por dia útil, para cumprir o prazo (${fmt(diasUteisRestantes)} dias úteis restantes)</div></div>

    prazoInfo = `<div class="card acc-amber" style="margin-top:14px"><h3>Data de início não definida</h3><div class="small">Informe a data do memorando de início abaixo para calcular o ritmo diário necessário e o prazo final.</div></div>`;

    <div class="card acc-purple"><h3>Falta digitalizar</h3><div class="big">${fmt(Math.max(0,imagensMeta-t.arquivos))}</div><div class="small">imagens até a meta contratual</div></div>

    <div><button class="btn" type="submit">Salvar</button></div>

  <div class="footnote">Os totais acima somam automaticamente todos os lançamentos de digitalização feitos na aba Digitalização, desde o início do uso do sistema. A meta de imagens é calculada como processos × folhas médias, mas pode ser sobrescrita manualmente.</div>

// ---------- DASHBOARD GERAL ----------
function shiftMonth(mk, n){
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthsBetween(mkStart, mkEnd){
  const [y1,m1] = mkStart.split('-').map(Number);
  const [y2,m2] = mkEnd.split('-').map(Number);
  return (y2-y1)*12 + (m2-m1);
}
async function contratoMesesProducao(){
  const c = state.contratoTJRJ;
  const inicioMk = c.dataInicio ? c.dataInicio.slice(0,7) : refMonth;
  let n = monthsBetween(inicioMk, refMonth);
  if(n<0) n=0;
  if(n>47) n=47; // limite de segurança (4 anos)
  const out = [];
  for(let i=0;i<=n;i++){
    const mk = shiftMonth(inicioMk, i);
    const arr = await getMonthArr('producao', mk);
    out.push({mk, total: arr.reduce((s,p)=>s+Number(p.arquivos||0),0)});
  }
  return out;
}
function monthLabel(mk){
  const [y,m] = mk.split('-');
  const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return nomes[Number(m)-1]+'/'+y.slice(2);
}

// ---------- FECHAMENTO ----------
async function renderFechamento(){
  const mk = refMonth;
  const prod = await getMonthArr('producao', mk);
  const hig = await getMonthArr('higienizacao', mk);
  const qual = await getMonthArr('qualidade', mk);
  const envio = await getMonthArr('envio', mk);
  const nas = await getMonthArr('nas', mk);
  const jaFechado = state.fechamentos.find(f=>f.mes===mk);

  const porOperador = state.operadores.map(op=>{
    let total=0, meta=0, extra={};
    if(op.funcao==='Digitalizador'){
      const regs = prod.filter(p=>p.operadorId===op.id);
      total = regs.reduce((s,p)=>s+Number(p.arquivos||0),0);
      meta = regs.reduce((s,p)=>s+metaDoDia(op,p),0);
      extra.caixas = regs.reduce((s,p)=>s+Number(p.caixas||0),0);
      extra.nid = regs.reduce((s,p)=>s+Number(p.nid||0),0);
    } else if(op.funcao==='Higienizador'){
      const regs = hig.filter(h=>h.operadorId===op.id);
      total = regs.reduce((s,h)=>s+Number(h.caixas||0),0);
      meta = regs.reduce((s,h)=>s+(h.metaManual?Number(h.metaManual):state.metaHigienizacao),0);
    } else {
      const regs = qual.filter(q=>q.operadorId===op.id);
      total = regs.reduce((s,q)=>s+Number(q.finalizados||0),0);
      meta = regs.reduce((s,q)=>s+(q.metaManual?Number(q.metaManual):state.metaQualidade.finalizados),0);
    }
    return {op, total, meta, extra, p: pct(total,meta||1)};
  }).filter(r=>r.meta>0 || r.total>0);

  const envioMes = envio.reduce((s,e)=>s+Number(e.arquivos||0),0);
  const aprovadosMes = envio.reduce((s,e)=>s+Number(e.aprovados||0),0);
  const nfDoMesFech = state.nfFechamentos.find(f=>f.mes===mk);
  const pagosMes = nfDoMesFech ? Number(nfDoMesFech.imagensPagas||0) : 0;
  const nasMes = nas.reduce((s,e)=>s+Number(e.arquivos||0),0);

  return `
  <div class="section-title"><h2>Fechamento mensal — ${mk.split('-').reverse().join('/')}</h2>
    ${jaFechado?`<span class="stamp green">Mês fechado</span>`:`<button class="btn" id="btn-fechar-mes">Fechar mês</button>`}
  </div>
  <div class="tablewrap">
  <table>
    <thead><tr><th>Operador</th><th>Função</th><th class="num">Total</th><th class="num">Meta</th><th class="num">%</th><th>Status</th></tr></thead>
    <tbody>
    ${porOperador.length?porOperador.map(r=>`
      <tr>
        <td>${r.op.nome}</td>
        <td>${r.op.funcao}</td>
        <td class="num">${fmt(r.total)}</td>
        <td class="num">${fmt(r.meta)}</td>
        <td class="num">${Math.round(r.p)}%</td>
        <td>${statusStamp(r.p)}</td>
      </tr>`).join(''):'<tr><td colspan="6" class="empty">Sem lançamentos neste mês.</td></tr>'}
    </tbody>
  </table>
  </div>
  <div class="divider"></div>
  <div class="grid cards">
    <div class="card acc-blue"><h3>Enviado ArqGer no mês</h3><div class="big">${fmt(envioMes)}</div></div>
    <div class="card acc-green"><h3>Aprovados no mês</h3><div class="big">${fmt(aprovadosMes)}</div></div>
    <div class="card acc-brass"><h3>Pagos no mês (NF)</h3><div class="big">${fmt(pagosMes)}</div>${!nfDoMesFech?`<div class="small">faturamento ainda não fechado</div>`:''}</div>
    <div class="card acc-teal"><h3>Backup NAS no mês</h3><div class="big">${fmt(nasMes)}</div></div>
  </div>
  ${state.fechamentos.length?`
  <div class="section-title"><h2>Meses fechados</h2></div>
  <div class="tablewrap"><table><thead><tr><th>Mês</th><th>Data do fechamento</th></tr></thead><tbody>
  ${state.fechamentos.slice().sort((a,b)=>b.mes.localeCompare(a.mes)).map(f=>`<tr><td>${f.mes.split('-').reverse().join('/')}</td><td>${f.dataFechamento}</td></tr>`).join('')}
  </tbody></table></div>`:''}
  `;
}

// ---------- HANDLERS ----------
function bindHandlers(){
  const main = document.getElementById('main');

  const formProd = document.getElementById('form-prod');
  if(formProd) formProd.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formProd);
    const entry = {
      id: uid(), operadorId: fd.get('operadorId'), data: fd.get('data'),
      scanner: fd.get('scanner'), arquivos: Number(fd.get('arquivos')||0),
      caixas: Number(fd.get('caixas')||0), nid: Number(fd.get('nid')||0),
      horas: fd.get('horas')?Number(fd.get('horas')):null,
      metaManual: fd.get('metaManual')?Number(fd.get('metaManual')):null,
      obs: fd.get('obs')||''
    };
    if(!entry.operadorId){ toast('Cadastre um operador primeiro.'); return; }
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('producao', mk);
    arr.push(entry);
    await saveMonthArr('producao', mk);
    state.contratoTotais.arquivos += entry.arquivos;
    state.contratoTotais.caixas += entry.caixas;
    state.contratoTotais.nid += entry.nid;
    await persistContrato();
    toast('Produção lançada.');
    render();
  };

  const formEnvio = document.getElementById('form-envio');
  if(formEnvio) formEnvio.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formEnvio);
    const entry = {id:uid(), data:fd.get('data'), responsavel:fd.get('responsavel')||'',
      arquivos:Number(fd.get('arquivos')||0), nids:Number(fd.get('nids')||0), caixas:Number(fd.get('caixas')||0),
      aprovados:Number(fd.get('aprovados')||0), consertos:Number(fd.get('consertos')||0)};
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('envio', mk);
    arr.push(entry);
    await saveMonthArr('envio', mk);
    state.arqgerTotais.enviados += entry.arquivos;
    state.arqgerTotais.nids += entry.nids;
    state.arqgerTotais.aprovados += entry.aprovados;
    state.arqgerTotais.consertos += entry.consertos;
    await persistArqgerTotais();
    toast('Envio lançado.');
    render();
  };

  const formNF = document.getElementById('form-nf');
  if(formNF) formNF.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formNF);
    const fechamento = {
      mes: refMonth,
      imagensPagas: Number(fd.get('imagensPagas')||0),
      numeroNF: fd.get('numeroNF')||'',
      dataFechamento: fd.get('dataFechamento')||todayStr
    };
    state.nfFechamentos.push(fechamento);
    state.arqgerTotais.pagos += fechamento.imagensPagas;
    await persistNF();
    await persistArqgerTotais();
    toast('Faturamento do mês fechado.');
    render();
  };

  const formNas = document.getElementById('form-nas');
  if(formNas) formNas.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formNas);
    const entry = {id:uid(), data:fd.get('data'), responsavel:fd.get('responsavel')||'', arquivos:Number(fd.get('arquivos')||0)};
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('nas', mk);
    arr.push(entry);
    await saveMonthArr('nas', mk);
    toast('Backup lançado.');
    render();
  };

  const formHig = document.getElementById('form-hig');
  if(formHig) formHig.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formHig);
    if(!fd.get('operadorId')){ toast('Cadastre um higienizador primeiro.'); return; }
    const entry = {id:uid(), operadorId:fd.get('operadorId'), data:fd.get('data'), caixas:Number(fd.get('caixas')||0), metaManual: fd.get('metaManual')?Number(fd.get('metaManual')):null};
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('higienizacao', mk);
    arr.push(entry);
    await saveMonthArr('higienizacao', mk);
    toast('Higienização lançada.');
    render();
  };

  const formQual = document.getElementById('form-qual');
  if(formQual) formQual.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formQual);
    if(!fd.get('operadorId')){ toast('Cadastre um operador de qualidade primeiro.'); return; }
    const entry = {id:uid(), operadorId:fd.get('operadorId'), data:fd.get('data'),
      arquivosQC:Number(fd.get('arquivosQC')||0), finalizados:Number(fd.get('finalizados')||0),
      certificado:Number(fd.get('certificado')||0), ocerizado:Number(fd.get('ocerizado')||0),
      pdfA:Number(fd.get('pdfA')||0), metaManual: fd.get('metaManual')?Number(fd.get('metaManual')):null};
    const mk = monthKey(entry.data);
    const arr = await getMonthArr('qualidade', mk);
    arr.push(entry);
    await saveMonthArr('qualidade', mk);
    toast('Controle de qualidade lançado.');
    render();
  };

  const funcaoSelect = document.getElementById('funcao-select');
  if(funcaoSelect) funcaoSelect.onchange = ()=>{
    const sf = document.getElementById('scanner-field');
    const vf = document.getElementById('servidor-field');
    if(sf) sf.style.display = funcaoSelect.value==='Digitalizador' ? '' : 'none';
    if(vf) vf.style.display = funcaoSelect.value==='Controle de Qualidade' ? '' : 'none';
  };

  const formOp = document.getElementById('form-op');
  if(formOp) formOp.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formOp);
    const funcao = fd.get('funcao');
    const op = {id:uid(), nome:fd.get('nome'), contato:fd.get('contato')||'', funcao:funcao,
      scanner: funcao==='Digitalizador'?fd.get('scanner'):null,
      servidor: funcao==='Controle de Qualidade'?fd.get('servidor'):null,
      ativo:true, dataCriacao: todayStr};
    state.operadores.push(op);
    await persistOperadores();
    toast('Operador cadastrado.');
    render();
  };

  main.querySelectorAll('[data-change-scanner]').forEach(sel=>{
    sel.onchange = async ()=>{
      const op = state.operadores.find(o=>o.id===sel.dataset.changeScanner);
      op.scanner = sel.value;
      await persistOperadores();
      toast('Escâner atualizado.');
    };
  });
  main.querySelectorAll('[data-change-servidor]').forEach(sel=>{
    sel.onchange = async ()=>{
      const op = state.operadores.find(o=>o.id===sel.dataset.changeServidor);
      op.servidor = sel.value;
      await persistOperadores();
      toast('Servidor atualizado.');
    };
  });
  main.querySelectorAll('[data-deactivate]').forEach(b=>{
    b.onclick = async ()=>{
      const op = state.operadores.find(o=>o.id===b.dataset.deactivate);
      op.ativo = false; op.dataDesativacao = todayStr;
      await persistOperadores(); toast('Operador desativado.'); render();
    };
  });
  main.querySelectorAll('[data-reactivate]').forEach(b=>{
    b.onclick = async ()=>{
      const op = state.operadores.find(o=>o.id===b.dataset.reactivate);
      op.ativo = true; op.dataDesativacao = null;
      await persistOperadores(); toast('Operador reativado.'); render();
    };
  });
  main.querySelectorAll('[data-remove]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Excluir definitivamente este operador do cadastro? O histórico de produção lançado permanece.')) return;
      state.operadores = state.operadores.filter(o=>o.id!==b.dataset.remove);
      await persistOperadores(); toast('Operador excluído.'); render();
    };
  });

  main.querySelectorAll('[data-del-prod]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('producao', mk);
      const removed = arr.find(p=>p.id===b.dataset.delProd);
      monthCache.producao[mk] = arr.filter(p=>p.id!==b.dataset.delProd);
      await saveMonthArr('producao', mk);
      if(removed){
        state.contratoTotais.arquivos = Math.max(0, state.contratoTotais.arquivos - Number(removed.arquivos||0));
        state.contratoTotais.caixas = Math.max(0, state.contratoTotais.caixas - Number(removed.caixas||0));
        state.contratoTotais.nid = Math.max(0, state.contratoTotais.nid - Number(removed.nid||0));
        await persistContrato();
      }
      render();
    };
  });
  main.querySelectorAll('[data-del-envio]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('envio', mk);
      const removed = arr.find(p=>p.id===b.dataset.delEnvio);
      monthCache.envio[mk] = arr.filter(p=>p.id!==b.dataset.delEnvio);
      await saveMonthArr('envio', mk);
      if(removed){
        state.arqgerTotais.enviados = Math.max(0, state.arqgerTotais.enviados - Number(removed.arquivos||0));
        state.arqgerTotais.nids = Math.max(0, state.arqgerTotais.nids - Number(removed.nids||0));
        state.arqgerTotais.aprovados = Math.max(0, state.arqgerTotais.aprovados - Number(removed.aprovados||0));
        state.arqgerTotais.consertos = Math.max(0, state.arqgerTotais.consertos - Number(removed.consertos||0));
        await persistArqgerTotais();
      }
      render();
    };
  });
  main.querySelectorAll('[data-del-nas]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('nas', mk);
      monthCache.nas[mk] = arr.filter(p=>p.id!==b.dataset.delNas);
      await saveMonthArr('nas', mk); render();
    };
  });
  main.querySelectorAll('[data-del-hig]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('higienizacao', mk);
      monthCache.higienizacao[mk] = arr.filter(p=>p.id!==b.dataset.delHig);
      await saveMonthArr('higienizacao', mk); render();
    };
  });
  main.querySelectorAll('[data-del-qual]').forEach(b=>{
    b.onclick = async ()=>{
      const mk = refMonth; const arr = await getMonthArr('qualidade', mk);
      monthCache.qualidade[mk] = arr.filter(p=>p.id!==b.dataset.delQual);
      await saveMonthArr('qualidade', mk); render();
    };
  });

  const formContrato = document.getElementById('form-contrato');
  if(formContrato) formContrato.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formContrato);
    state.contratoTJRJ = {
      nome: fd.get('nome')||'Contrato',
      processosMeta: Number(fd.get('processosMeta')||0),
      folhasMedia: Number(fd.get('folhasMedia')||0),
      imagensMeta: Number(fd.get('imagensMeta')||0),
      dataInicio: fd.get('dataInicio')||'',
      duracaoAnos: Number(fd.get('duracaoAnos')||4)
    };
    await persistContrato();
    toast('Dados do contrato salvos.');
    render();
  };

  const formMetasScanner = document.getElementById('form-metas-scanner');
  if(formMetasScanner) formMetasScanner.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formMetasScanner);
    SCANNERS.forEach(s=>{
      state.metasScanner[s] = {diaria:Number(fd.get('d-'+s)||0), hora:Number(fd.get('h-'+s)||0)};
    });
    await persistMetas(); toast('Metas de escâner salvas.'); render();
  };
  const formMetasOutras = document.getElementById('form-metas-outras');
  if(formMetasOutras) formMetasOutras.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formMetasOutras);
    state.metaHigienizacao = Number(fd.get('metaHig')||0);
    state.metaQualidade = {qc:Number(fd.get('metaQC')||0), finalizados:Number(fd.get('metaFin')||0)};
    await persistMetas(); toast('Metas salvas.'); render();
  };
  const formMetasArqger = document.getElementById('form-metas-arqger');
  if(formMetasArqger) formMetasArqger.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formMetasArqger);
    state.metaArqger = {diaria:Number(fd.get('d')||0), semanal:Number(fd.get('s')||0), mensal:Number(fd.get('m')||0)};
    await persistMetas(); toast('Metas de envio salvas.'); render();
  };
  const formThresholds = document.getElementById('form-thresholds');
  if(formThresholds) formThresholds.onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(formThresholds);
    state.thresholds = {baixa:Number(fd.get('baixa')||0), media:Number(fd.get('media')||0), boa:Number(fd.get('boa')||0)};
    await persistMetas(); toast('Faixas de status salvas.'); render();
  };

  const btnFechar = document.getElementById('btn-fechar-mes');
  if(btnFechar) btnFechar.onclick = async ()=>{
    if(!confirm('Fechar o mês atual? Isso marca o período como encerrado para conferência.')) return;
    state.fechamentos.push({mes:refMonth, dataFechamento: todayStr.split('-').reverse().join('/')});
    await saveJSON('sp-fechamentos', state.fechamentos);
    toast('Mês fechado.'); render();
  };
}

(async function init(){
  const logoImg = document.getElementById('logo-img');
  if(logoImg) logoImg.src = 'data:image/png;base64,'+LOGO_B64;
  await loadAll();
  setCloudStatus('ok');
  render();
})();
</script>
</body>
</html>
