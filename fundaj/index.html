<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produção FADURPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#16181d; --ink2:#4a505c; --ink3:#6c7380; --line:#dfe2e7; --line2:#eceef1;
  --paper:#fff; --mist:#f3f4f6; --brand:#f07a13; --brand-d:#b95600; --brand-t:#fff1e4;
  --dig:#eb6834; --foto:#1baf7a; --fin:#2a78d6; --sup:#7b8290;
  --good:#17754a; --warn:#946000; --serious:#bd4708; --crit:#b42318;
  --good-t:#e4f4ec; --warn-t:#fbf2d9; --serious-t:#fde9dc; --crit-t:#fce8e6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mist);color:var(--ink);font:15px/1.45 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700}
h1{font-size:26px;letter-spacing:-.01em} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-d);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--paper);border-right:1px solid var(--line);padding:20px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
.logos{padding:0 20px 18px;display:grid;gap:12px;border-bottom:1px solid var(--line2)}
.logos img{display:block;width:100%;height:auto}
.logos img+img{width:82%}
nav{padding:12px 0;flex:1}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:9px 16px;cursor:pointer;font-weight:500;color:var(--ink2)}
nav button:hover{background:var(--mist)}
nav button.on{border-left-color:var(--brand);color:var(--ink);font-weight:700;background:var(--brand-t)}
.sync{padding:12px 20px 0;border-top:1px solid var(--line2);font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--warn);margin-top:5px;flex:none}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--crit)}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px}
.monthnav button{border:0;background:none;width:34px;height:34px;border-radius:6px;font-size:18px;cursor:pointer}
.monthnav button:hover:not(:disabled){background:var(--mist)} .monthnav button:disabled{opacity:.3}
.monthnav b{min-width:136px;text-align:center}
.sub{color:var(--ink2)} .small{font-size:13px} .muted{color:var(--ink3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;min-width:0}
.panel>h2,.panel>.spread{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{background:var(--mist)}
.btn.pri{background:var(--brand);border-color:var(--brand-d);color:#1a0d00}
.btn.pri:hover{background:#fa8a26}
.btn.dan{color:var(--crit);border-color:#efc4bf}
.btn.sm{padding:3px 9px;min-height:30px;font-size:13px;font-weight:500}
.tw{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;color:var(--ink2);text-align:left;border-bottom:1.5px solid var(--line);padding:7px 9px;white-space:nowrap;vertical-align:bottom}
td{border-bottom:1px solid var(--line2);padding:7px 9px;vertical-align:middle}
tr.tot td{font-weight:700;border-top:1.5px solid var(--line);border-bottom:0;background:var(--mist)}
.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--mist)}
tr.cur td{background:var(--brand-t)}
.bdg{display:inline-block;padding:1px 8px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.g{background:var(--good-t);color:var(--good)} .w{background:var(--warn-t);color:var(--warn)} .s{background:var(--serious-t);color:var(--serious)} .c{background:var(--crit-t);color:var(--crit)} .z{background:var(--mist);color:var(--ink2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.meter{height:7px;border-radius:4px;background:var(--line2);overflow:hidden;min-width:60px}
.meter span{display:block;height:100%;border-radius:4px;background:var(--brand)}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:2px 0 14px}
.pc{position:relative;background:var(--mist);padding:14px 30px 14px 34px;overflow:hidden;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%);margin-right:-13px;min-height:152px}
.pc:first-child{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);padding-left:16px}
.pc:last-child{margin-right:0}
.pc .fill{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.2}
.pc>div:not(.fill){position:relative}
.pc .big{font-size:27px;font-weight:800;letter-spacing:-.015em;line-height:1.1;margin:5px 0 2px}
.pc .nm{font-weight:700;display:flex;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border-top:1px solid var(--line2)}
.kpi{padding:12px 14px 2px 0}
.kpi b{display:block;font-size:21px;font-weight:700;letter-spacing:-.01em}
.kpi>span{font-size:13px;color:var(--ink2);display:block}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:6px}
.leg .ln{display:inline-block;width:16px;border-top:2px solid;vertical-align:middle;margin-right:6px}
.chart{width:100%;position:relative} .chart svg{display:block;width:100%;touch-action:pan-y}
.chart text{font:12px "Hanken Grotesk",system-ui,sans-serif;fill:var(--ink3)}
#tip{position:fixed;z-index:60;background:var(--ink);color:#fff;padding:7px 10px;border-radius:7px;font-size:13px;pointer-events:none;display:none;white-space:nowrap;line-height:1.5}
#tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--paper);padding:6px 11px;cursor:pointer;font-size:13.5px;font-weight:500}
.seg button.on{background:var(--ink);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.f{display:grid;gap:4px;font-size:13.5px;font-weight:600;color:var(--ink2);min-width:0}
.f.wide{grid-column:1/-1}
.f input,.f select,.f textarea,td input,td select,.inp{border:1px solid #c6cbd3;border-radius:6px;padding:8px 9px;background:#fff;font-weight:400;color:var(--ink);width:100%;min-height:38px}
.f input[type=checkbox]{width:auto;min-height:0}
td input,td select{padding:5px 7px;min-height:32px}
td input.num{width:92px;text-align:right}
.big-in{font-size:18px!important;font-weight:700!important;padding:3px 9px!important;height:38px}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap;font-weight:500;color:var(--ink)}
.checks label{display:flex;gap:6px;align-items:center;min-height:30px}
.note{overflow-wrap:anywhere;background:var(--brand-t);border-left:4px solid var(--brand);padding:9px 12px;border-radius:0 6px 6px 0;font-size:14px}
.note.c{background:var(--crit-t);border-color:var(--crit);color:inherit}
.empty{padding:26px 10px;text-align:center;color:var(--ink2)}
dialog{border:0;border-radius:12px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 18px 60px rgba(10,14,22,.35);color:var(--ink)}
dialog::backdrop{background:rgba(15,18,24,.45)}
.dh{padding:15px 18px;border-bottom:1px solid var(--line2);font-weight:700;font-size:17px}
.db{padding:16px 18px}
.df{padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.df .btn.dan{margin-right:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;z-index:70;display:none;max-width:calc(100vw - 32px)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{font-size:12.5px;color:var(--ink3);text-align:center}
.cal button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 3px;min-height:58px;cursor:pointer;text-align:center;font-size:13px;line-height:1.25}
.cal button b{display:block;font-size:14px}
.cal button.off{background:var(--mist);color:var(--ink3)}
.cal button.ov{border:2px solid var(--brand)}
.cal button.today{box-shadow:inset 0 0 0 1px var(--ink)}
.cal span.blank{display:block}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--good-t);border-color:#a6d9bf;color:var(--good);font-weight:600}
.code{font-weight:700;word-break:break-all}
details summary{cursor:pointer;font-weight:600}
.sign{display:none}
.phead{display:none}
.mobilehead{display:none}
@media(max-width:860px){
  .app{display:block}
  .rail{position:sticky;top:0;height:auto;z-index:30;padding:8px 0 0;border-right:0;border-bottom:1px solid var(--line);display:block}
  .logos{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px;border:0}
  .logos img{width:auto;height:26px}.logos img+img{width:auto;height:24px}
  nav{display:flex;overflow-x:auto;padding:0;scrollbar-width:none}
  nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:8px 12px}
  nav button.on{border-bottom-color:var(--brand);background:none}
  .sync{border:0;padding:0 16px 7px;font-size:12px;position:static}
  .sync i{margin-top:4px}
  main{padding:14px 16px 50px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .pc,.pc:first-child{clip-path:none;margin:0;padding:11px 12px;min-height:0;border-radius:7px}
  .pc .big{font-size:22px}
  .panel{padding:14px}
  h1{font-size:22px}
  .cal button{min-height:50px;font-size:11.5px}
}
@media print{
  @page{size:A4 landscape;margin:11mm}
  html,body{background:#fff;font-size:11.5px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rail,.noprint,#toast,#tip,.monthnav,dialog{display:none!important}
  .app{display:block} main{padding:0}
  .phead{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:10px}
  .phead img{height:40px;width:auto}.phead div{text-align:center;font-size:11px}
  .panel{border:0;padding:0;margin-bottom:12px;break-inside:auto}
  table{font-size:10.5px} th,td{padding:3px 5px} .tw{overflow:visible}
  tr{break-inside:avoid}
  .pc{clip-path:none;margin:0 4px 0 0;min-height:0;padding:7px 9px!important;border:1px solid var(--line)}
  .sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:44px;break-inside:avoid}
  .sign div{border-top:1px solid var(--ink);padding-top:4px;text-align:center}
  td input,td select{border:0;padding:0;min-height:0;background:none;appearance:none}
}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:pop .14s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>

    <div id="banner"></div>
    <div id="view"></div>

</div>
<dialog id="dlg"></dialog>
<div id="tip"></div><div id="toast" role="status"></div>

const ST={dig:{n:'Digitalização no escâner',s:'Escâner',c:'var(--dig)',hex:'#eb6834',q:'Imagens digitalizadas',out:'Master TIFF e TIFF Derivado, 300 DPI'},
  foto:{n:'Fotografia',s:'Fotos',c:'var(--foto)',hex:'#1baf7a',q:'Fotos batidas (JPG)',out:'Fotos JPG para tratamento posterior'},
  fin:{n:'Finalização',s:'Finalização',c:'var(--fin)',hex:'#2a78d6',q:'Imagens finalizadas e prontas para envio',out:'PDF com OCR, controle de qualidade feito'},
  sup:{n:'Supervisão',s:'Supervisão',c:'var(--sup)',hex:'#7b8290',q:'Quantidade',out:'Acompanhamento'}};
const STG={capt:{n:'Capturadas',hex:'#eb6834'},fin:{n:'Finalizadas para envio',hex:'#2a78d6'},ent:{n:'Entregues ao cliente',hex:'#1baf7a'},apr:{n:'Aprovadas para pagamento',hex:'#6250d6'}};
const ALLST=['dig','foto','fin','sup'], PROD=['dig','foto','fin'];
const ORIG={esc:'Do escâner',foto:'Das fotos'};
const stN=s=>ST[s]?.n||'Serviço antigo', stC=s=>ST[s]?.c||'var(--sup)';
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mm=d=>({dig:d,foto:0,fin:d,sup:0});
const DEF={inicio:'2026-11-03',fimAlvo:'2027-03-31',fimPrazo:'2027-04-30',
  metas:{'2026-11':mm(4000),'2026-12':mm(4500),'2027-01':mm(5000),'2027-02':mm(5000),'2027-03':mm(5000),'2027-04':mm(5000)},
  naoUteis:['2026-12-24','2026-12-25','2026-12-31','2027-01-01','2027-02-08','2027-02-09','2027-02-10','2027-03-26','2027-04-21'],
  uteisExtra:[],dia:{},notas:{otimo:100,bom:85,regular:70}};
const SIT={presente:'Compareceu',parcial:'Compareceu em parte',falta:'Não compareceu',folga:'Sem escala'};

/* ========= Utilitários ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fn=(n,d=0)=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje=()=>iso(new Date());
const dt=s=>new Date(s+'T12:00:00');
const br=s=>s?s.split('-').reverse().join('/'):'';
const br2=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const nextD=(s,k=1)=>{const d=dt(s);d.setDate(d.getDate()+k);return iso(d)};
const ymOf=s=>s.slice(0,7);
const ymLabel=y=>`${MES[+y.slice(5,7)-1]} de ${y.slice(0,4)}`;
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const lastOfM=y=>{const[a,m]=y.split('-').map(Number);return iso(new Date(a,m,0))};
const addM=(y,k)=>{const[a,m]=y.split('-').map(Number);const d=new Date(a,m-1+k,1);return iso(d).slice(0,7)};
const num=v=>{if(v===''||v==null)return 0;const n=Number(String(v).replace(',','.'));return isNaN(n)?0:n};
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3400)}

/* ========= Armazenamento: documentos por mês, cada registro em um campo ========= */
const shards={};           // shardId -> {id:rec}
const shardOf=(k,r)=>({lanc:1,pres:1,diario:1}[k]?`${k}_${ymOf(r.data)}`:k==='acervo'?`acervo_${hash(r.id)%8}`:k);
const kindOf=s=>s.split('_')[0];
const all=k=>{let o=[];for(const s in shards)if(kindOf(s)===k)o=o.concat(Object.values(shards[s]));return o};
const backend={mode:'init',write:async()=>{}};
let cacheV=0;
function applyShard(id,items){const m={};for(const k in (items||{})){try{m[k]=JSON.parse(items[k])}catch(e){}}shards[id]=m;cacheV++;schedule()}
function put(k,r){if(!r.id)r.id=nid();
  for(const s in shards){if(kindOf(s)===k&&shards[s][r.id]&&s!==shardOf(k,r)){del(k,shards[s][r.id])}}
  return backend.write(shardOf(k,r),{[r.id]:JSON.stringify(r)})}
function del(k,r){return backend.write(shardOf(k,r),{[r.id]:null})}
function putMany(k,list){const g={};for(const r of list){if(!r.id)r.id=nid();const s=shardOf(k,r);(g[s]=g[s]||{})[r.id]=JSON.stringify(r)}
  return Promise.all(Object.entries(g).map(([s,m])=>backend.write(s,m)))}
function cfg(){const c=(shards.cfg||{}).main||{};return {...DEF,...c,metas:{...DEF.metas,...(c.metas||{})},notas:{...DEF.notas,...(c.notas||{})},dia:c.dia||{}}}
const saveCfg=c=>put('cfg',{...c,id:'main'});

function setSync(cl,t){const e=$('#sync');e.className='sync '+cl;e.querySelector('span').textContent=t}
function useLocal(reason){
  backend.mode='local';
  let raw={};try{raw=JSON.parse(localStorage.getItem('fadurpe_v1')||'{}')}catch(e){}
  for(const s in raw)applyShard(s,raw[s]);
  backend.write=async(s,m)=>{const cur=raw[s]||{};for(const k in m){if(m[k]===null)delete cur[k];else cur[k]=m[k]}raw[s]=cur;try{localStorage.setItem('fadurpe_v1',JSON.stringify(raw))}catch(e){toast('Não foi possível salvar neste aparelho.')}applyShard(s,cur)};
  setSync('err','Só neste aparelho: sem sincronização');
  $('#banner').innerHTML=`<div class="note c noprint" style="margin-bottom:14px"><b>Sem sincronização.</b> ${esc(reason)} O que for lançado agora fica somente neste aparelho.</div>`;
  schedule();
}
async function connect(){
  try{
    const u=m=>`https://www.gstatic.com/firebasejs/${FB_V}/firebase-${m}.js`;
    const [A,F,U]=await Promise.all([import(u('app')),import(u('firestore')),import(u('auth'))]);
    const app=A.initializeApp(firebaseConfig);
    let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.initializeFirestore(app,{})}
    const auth=U.getAuth(app);
    await new Promise((res,rej)=>{const off=U.onAuthStateChanged(auth,x=>{if(x){off();res(x)}});U.signInAnonymously(auth).catch(e=>{if(!navigator.onLine){off();res(null)}else rej(e)})});
    backend.mode='cloud';$('#banner').innerHTML='';
    backend.write=(s,m)=>{const items={};for(const k in m)items[k]=m[k]===null?F.deleteField():m[k];
      return F.setDoc(F.doc(db,COLECAO,s),{items,atualizadoEm:Date.now()},{merge:true}).catch(e=>{console.error(e);toast('Não foi salvo na nuvem: '+(e.code||e.message));throw e})};
    /* envia o que foi lançado enquanto o aparelho estava sem conexão com o Firebase */
    try{const raw=JSON.parse(localStorage.getItem('fadurpe_v1')||'null');if(raw){await Promise.race([Promise.all(Object.entries(raw).map(([s,m])=>Object.keys(m).length?backend.write(s,m):0)),new Promise(r=>setTimeout(r,800))]);localStorage.removeItem('fadurpe_v1');toast('Lançamentos deste aparelho enviados.')}}catch(e){console.error(e)}
    F.onSnapshot(F.collection(db,COLECAO),{includeMetadataChanges:true},snap=>{
      snap.docChanges().forEach(c=>{if(c.type==='removed'){delete shards[c.doc.id];cacheV++;schedule()}else applyShard(c.doc.id,c.doc.data().items)});
      const m=snap.metadata;
      if(!navigator.onLine)setSync('','Sem internet: guardado neste aparelho e será enviado ao reconectar');
      else if(m.hasPendingWrites)setSync('','Enviando alterações');
      else if(m.fromCache)setSync('','Conectando ao servidor');
      else setSync('ok','Sincronizado entre os aparelhos');
    },e=>{console.error(e);setSync('err','Sem acesso à base de dados');
      $('#banner').innerHTML=`<div class="note c noprint" style="margin-bottom:14px"><b>O Firebase recusou o acesso (${esc(e.code||'erro')}).</b> Confira no Firebase, em Firestore &gt; Regras, se a coleção ${COLECAO} está liberada para usuários autenticados.</div>`});
  }catch(e){console.error(e);if(backend.mode!=='local')useLocal('Não foi possível conectar ao Firebase. Confira a internet: o envio acontece quando a conexão voltar.')}
}

/* ========= Calendário e plano ========= */
let memoV=-1,memo={};
const M=(key,f)=>{if(memoV!==cacheV){memo={};memoV=cacheV}return key in memo?memo[key]:(memo[key]=f())};
const isWeekday=s=>{const w=dt(s).getDay();return w>0&&w<6};
function isUtil(s){const c=cfg();if(s<c.inicio)return false;if(c.uteisExtra.includes(s))return true;return isWeekday(s)&&!c.naoUteis.includes(s)}
function monthsList(){const c=cfg();const o=[];let y=ymOf(c.inicio);const end=ymOf(c.fimPrazo);while(y<=end){o.push(y);y=addM(y,1)}return o}
function utilDays(a,b){return M(`ud|${a}|${b}`,()=>{const o=[];for(let d=a;d<=b;d=nextD(d))if(isUtil(d))o.push(d);return o})}
/* captura (escâner + fotos) e finalização param ao chegar nas 400.000 imagens */
function plan(){return M('plan',()=>{const c=cfg(),out={dig:{},foto:{},fin:{},sup:{}};let rc=TOTAL,rf=TOTAL;
  const base=(s,d)=>{const ov=(c.dia[d]||{})[s];return ov!=null?ov:((c.metas[ymOf(d)]||{})[s]||0)};
  for(const d of utilDays(c.inicio,c.fimPrazo)){
    const g=Math.min(base('dig',d),rc);rc-=g;const f=Math.min(base('foto',d),rc);rc-=f;const z=Math.min(base('fin',d),rf);rf-=z;
    out.dig[d]=g;out.foto[d]=f;out.fin[d]=z;out.sup[d]=base('sup',d)}
  out.restC=rc;out.restF=rf;return out})}
const planDay=(st,d)=>st==='capt'?plan().dig[d]+plan().foto[d]||0:(plan()[st][d]||0);
const sumPlan=(st,a,b)=>utilDays(a,b).reduce((t,d)=>t+planDay(st,d),0);
function lastPlanDay(st){const c=cfg();return [...utilDays(c.inicio,c.fimPrazo)].reverse().find(d=>planDay(st,d)>0)||c.fimPrazo}

/* ========= Colaboradores, metas e produção ========= */
const colabs=()=>M('colabs',()=>all('colab').sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')));
const cById=id=>colabs().find(c=>c.id===id);
const ativoEm=(c,d)=>(!c.inicio||d>=c.inicio)&&(!c.fim||d<=c.fim);
function condOf(c,d){const l=(c.cond||[]).slice().sort((a,b)=>a.desde<b.desde?-1:1);let r=l[0]||{metas:{}};for(const x of l)if(x.desde<=d)r=x;return r}
function metaInd(c,st,d){if(!isUtil(d)||!ativoEm(c,d)||!(c.funcs||[]).includes(st))return 0;
  const own=condOf(c,d).metas?.[st];if(own>0)return own;
  return M(`auto|${st}|${d}`,()=>{const g=colabs().filter(x=>ativoEm(x,d)&&(x.funcs||[]).includes(st));let fixed=0,free=0;
    for(const x of g){const m=condOf(x,d).metas?.[st];if(m>0)fixed+=m;else free++}
    return free?Math.max(0,(planDay(st,d)-fixed)/free):0})}
const lancs=()=>M('lancs',()=>all('lanc').sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:(b.em||0)-(a.em||0)));
const presOf=(d,cid)=>(shards[`pres_${ymOf(d)}`]||{})[`${d}_${cid}`];
const inR=(l,a,b)=>l.data>=a&&l.data<=b;
const ents=()=>M('ents',()=>all('ent').sort((a,b)=>a.data<b.data?1:-1));
const nfs=()=>M('nfs',()=>all('nf').sort((a,b)=>(a.data||'')<(b.data||'')?1:-1));
const nfDe=eid=>nfs().find(n=>(n.entregas||[]).includes(eid));
function totals(a='0',b='9'){return M(`tot|${a}|${b}`,()=>{const t={dig:0,foto:0,fin:0,sup:0,finEsc:0,finFoto:0,rep:0,ent:0,apr:0,nf:0,nNf:0,nEnt:0};
  for(const l of lancs())if(inR(l,a,b)&&l.func in t){const q=num(l.qtd);t[l.func]+=q;t.rep+=num(l.rep);if(l.func==='fin'){if(l.orig==='foto')t.finFoto+=q;else t.finEsc+=q}}
  for(const e of ents()){if(inR(e,a,b)){t.ent+=num(e.qtd);t.nEnt++}if(e.aprovData&&e.aprovData>=a&&e.aprovData<=b)t.apr+=num(e.aprovQtd)}
  for(const n of nfs())if(n.data&&n.data>=a&&n.data<=b){t.nf+=num(n.qtd);t.nNf++}
  t.capt=t.dig+t.foto;return t})}
const stageVal=(t,k)=>k==='capt'?t.capt:t[k];
function nota(p){const n=cfg().notas;if(p==null)return{l:'Sem meta',k:'z'};if(p>=n.otimo)return{l:'Ótimo',k:'g'};if(p>=n.bom)return{l:'Bom',k:'g'};if(p>=n.regular)return{l:'Regular',k:'w'};return{l:'Abaixo da meta',k:'c'}}
const bdg=p=>{const x=nota(p);return`<span class="bdg ${x.k}">${x.l}</span>`};
const horasDia=(cid,d)=>{const p=presOf(d,cid);if(p&&p.horas!=null&&p.horas!=='')return num(p.horas);return lancs().filter(l=>l.colab===cid&&l.data===d).reduce((t,l)=>t+num(l.horas),0)};
/* média por dia com produção, para comparar períodos */
function media(cid,st,a,b){const ls=lancs().filter(l=>l.colab===cid&&l.func===st&&inR(l,a,b));const d=new Set(ls.map(l=>l.data)).size;return d?ls.reduce((t,l)=>t+num(l.qtd),0)/d:0}
function trend(cur,prev){if(!cur||!prev)return'<span class="muted small">Sem comparação</span>';const p=(cur/prev-1)*100;
  if(p>=3)return`<span class="bdg g">▲ Melhorou ${fn(p)}%</span>`;if(p<=-3)return`<span class="bdg c">▼ Caiu ${fn(-p)}%</span>`;return'<span class="bdg z">Estável</span>'}
function resumo(a,b,cid){const lim=hoje()<b?hoje():b,out=[];
  for(const c of colabs()){if(cid&&c.id!==cid)continue;
    const my=lancs().filter(l=>l.colab===c.id&&inR(l,a,b));const st=new Set(my.map(l=>l.func));
    for(const s of ALLST){const active=(c.funcs||[]).includes(s)&&utilDays(a,b).some(d=>ativoEm(c,d));if(!st.has(s)&&!active)continue;
      const ls=my.filter(l=>l.func===s),qtd=ls.reduce((t,l)=>t+num(l.qtd),0),rep=ls.reduce((t,l)=>t+num(l.rep),0),hs=ls.reduce((t,l)=>t+num(l.horas),0);
      const meta=lim>=a?utilDays(a,lim).reduce((t,d)=>t+metaInd(c,s,d),0):0,dias=new Set(ls.map(l=>l.data)).size;
      out.push({c,s,qtd,rep,hs,meta,p:meta>0?qtd/meta*100:null,dias,med:dias?qtd/dias:0})}}
  return out}
function presenca(a,b,cid){let faltas=0,parc=0,hs=0;const dias=new Set();for(let d=a;d<=b;d=nextD(d)){const p=presOf(d,cid);if(p?.status==='falta')faltas++;if(p?.status==='parcial')parc++;hs+=horasDia(cid,d)}
  for(const l of lancs())if(l.colab===cid&&inR(l,a,b))dias.add(l.data);return{faltas,parc,hs,dias:dias.size}}
const fechado=d=>{const f=shards.fech||{};return f[d]||f[ymOf(d)]};
const aberto=d=>{const f=fechado(d);if(f){toast(`${f.id.length>7?'Este dia':'Este mês'} está fechado. Reabra em Fechamento para alterar.`);return false}return true};
/* semanas de segunda a sexta, para a evolução dos operadores */
function semanas(ref,n=4){const d=dt(ref),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);const o=[];for(let i=n-1;i>=0;i--){const s=new Date(d);s.setDate(s.getDate()-7*i);const a=iso(s);o.push({a,b:nextD(a,4)})}return o}

/* ========= Estado de tela ========= */
const TABS=[['painel','Painel'],['lancar','Lançar produção'],['entregas','Entregas e notas'],['equipe','Equipe'],['historico','Histórico'],['metas','Metas'],['diario','Diário da equipe'],['tarefas','Tarefas'],['acervo','Acervo'],['fechamento','Fechamento']];
const today0=()=>{const h=hoje(),c=DEF;return h<c.inicio?c.inicio:h};
const ui={tab:'painel',ym:ymOf(today0()),st:'dig',lanc:{data:today0(),colab:'',func:'dig',orig:'esc',qtd:'',rep:'',horas:'',obra:'',obs:''},fCol:'',fSt:'',dia:today0(),hist:'',fmode:'mes',fdia:today0(),aq:''};
try{const t=localStorage.getItem('fadurpe_tab');if(TABS.some(x=>x[0]===t))ui.tab=t}catch(e){}
let schedT,pending=false;
const editing=a=>a&&a.closest&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
function schedule(){clearTimeout(schedT);schedT=setTimeout(()=>{const a=document.activeElement;
  if(a&&a.hasAttribute&&a.hasAttribute('data-lf')&&a.tagName==='INPUT'){const n=a.name;render();document.querySelector(`#fLanc [name=${n}]`)?.focus();return}
  if(editing(a)){pending=true;return}
  render()},50)}
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(!editing(document.activeElement)){pending=false;render()}},250)});
function render(){pending=false;
  $('#nav').innerHTML=TABS.map(([k,n])=>`<button data-act="tab" data-v="${k}" class="${ui.tab===k?'on':''}" ${ui.tab===k?'aria-current="page"':''}>${n}</button>`).join('');
  const name=TABS.find(t=>t[0]===ui.tab)[1];$('#title').textContent=name;$('#ptitle').textContent=`Produção FADURPE: ${name}`;$('#pdate').textContent=`${ymLabel(ui.ym)}. Emitido em ${br(hoje())}`;
  $('#mlabel').textContent=ymLabel(ui.ym);
  const ms=monthsList();$('[data-act=prevM]').disabled=ui.ym<=ms[0];$('[data-act=nextM]').disabled=ui.ym>=addM(ms[ms.length-1],2);
  const y=window.scrollY;$('#view').innerHTML=V[ui.tab]();window.scrollTo(0,y);afterRender[ui.tab]?.()}

/* ========= Painel ========= */
function serieDia(k){const o={};if(k==='capt'||PROD.includes(k)){for(const l of lancs()){const ok=k==='capt'?(l.func==='dig'||l.func==='foto'):l.func===k;if(ok)o[l.data]=(o[l.data]||0)+num(l.qtd)}}
  else if(k==='ent'){for(const e of ents())o[e.data]=(o[e.data]||0)+num(e.qtd)}else if(k==='apr'){for(const e of ents())if(e.aprovData)o[e.aprovData]=(o[e.aprovData]||0)+num(e.aprovQtd)}return o}
function forecast(){const c=cfg(),h=hoje(),t=totals(),g=t.capt<=t.fin?'capt':'fin',rest=TOTAL-stageVal(t,g);
  if(rest<=0)return{fim:'pronto',g};const past=utilDays(c.inicio,h).slice(-10),s=serieDia(g),rate=past.length?past.reduce((a,d)=>a+(s[d]||0),0)/past.length:0;let fim=null;
  if(rate>0){let r=rest,d=h<c.inicio?c.inicio:h;for(let i=0;i<900&&r>0;i++){d=nextD(d);if(isUtil(d)||(d>c.fimPrazo&&isWeekday(d)))r-=rate}fim=d}
  return{fim,g,rate}}
function V_painel(){const c=cfg(),h=hoje(),t=totals(),td=totals(h,h),a=`${ui.ym}-01`,b=lastOfM(ui.ym);
  const dias=utilDays(c.inicio,c.fimPrazo),idx=dias.filter(d=>d<=h).length,fc=forecast(),inProj=h>=c.inicio;
  const sub={capt:`Escâner ${fn(t.dig)}, fotos ${fn(t.foto)}`,fin:`Do escâner ${fn(t.finEsc)}, das fotos ${fn(t.finFoto)}`,ent:`${t.nEnt} entregas em HD`,apr:`${fn(t.ent-t.apr)} aguardando aprovação`};
  const hojeT={capt:`Hoje ${fn(td.capt)} de ${fn(planDay('capt',h))}`,fin:`Hoje ${fn(td.fin)} de ${fn(planDay('fin',h))}`,ent:`Prontas para entregar: ${fn(Math.max(0,t.fin-t.ent))}`,apr:`Com nota fiscal: ${fn(t.nfAll??totNf())}`};
  const pipe=Object.keys(STG).map(k=>{const v=stageVal(t,k),p=v/TOTAL*100;return`<div class="pc" style="--c:${STG[k].hex}"><div class="fill" style="width:calc(${k==='capt'?'0px':'18px'} + (100% - ${k==='capt'?'18px':'36px'}) * ${Math.min(100,p)/100})"></div>
    <div class="nm"><span class="dot" style="background:${STG[k].hex}"></span>${STG[k].n}</div><div class="big">${fn(v)}</div>
    <div class="small">de ${fn(TOTAL)}, ${fn(p,1)}%</div><div class="small sub">${hojeT[k]}</div><div class="small muted">${sub[k]}</div></div>`}).join('');
  let fcT;if(!inProj)fcT=`<b>Início em ${br(c.inicio)}</b><span>A previsão aparece com os primeiros lançamentos</span>`;
  else if(fc.fim==='pronto')fcT=`<b>Concluído</b><span>${fn(TOTAL)} imagens capturadas e finalizadas</span>`;
  else if(!fc.fim)fcT=`<b>Sem ritmo ainda</b><span>Sem produção de ${fc.g==='capt'?'captura':'finalização'} nos últimos dias</span>`;

  const rows=resumo(a,b).filter(r=>r.s!=='sup').sort((x,y)=>(y.p??-1)-(x.p??-1));

    </div></section>

    <div class="chart" id="cBurn"></div></section>

    ${rows.map(r=>{const q=lancs().filter(l=>l.colab===r.c.id&&l.func===r.s&&l.data===h).reduce((t,l)=>t+num(l.qtd),0),f=presenca(a,b,r.c.id);
      return`<tr class="click" data-act="goHist" data-v="${r.c.id}"><td><b>${esc(r.c.nome)}</b></td><td><span class="dot" style="background:${ST[r.s].c}"></span>${ST[r.s].s}</td><td class="n">${fn(q)}</td><td class="n">${fn(r.qtd)}</td><td class="n">${fn(r.meta)}</td><td style="min-width:110px">${r.p!=null?`<div class="row" style="flex-wrap:nowrap"><div class="meter" style="flex:1"><span style="width:${Math.min(100,r.p)}%"></span></div><span class="small">${fn(r.p)}%</span></div>`:'<span class="muted small">Sem meta</span>'}</td><td class="n">${fn(r.med)}</td><td class="n">${f.faltas}</td><td>${bdg(r.p)}</td><td>${trend(media(r.c.id,r.s,w1.a,w1.b),media(r.c.id,r.s,w0.a,w0.b))}</td></tr>`}).join('')}
    </tbody></table></div>`:`<div class="empty">Nenhum operador cadastrado. <button class="btn" data-act="tab" data-v="equipe">Cadastrar equipe</button></div>`}</section>
  ${evolucao(ref)}`}
function totNf(){return nfs().reduce((t,n)=>t+num(n.qtd),0)}
function evolucao(ref){const w=semanas(ref),ops=[];for(const c of colabs())for(const s of PROD)if((c.funcs||[]).includes(s)||lancs().some(l=>l.colab===c.id&&l.func===s))ops.push({c,s});
  if(!ops.length)return'';
  return`<section class="panel"><div class="spread"><h2>Evolução dos operadores</h2><span class="small sub">Média de imagens por dia trabalhado, semana a semana</span></div><div class="tw"><table><thead><tr><th>Operador</th><th>Serviço</th>${w.map(x=>`<th class="n">${br2(x.a)} a ${br2(x.b)}</th>`).join('')}<th>Última semana</th></tr></thead><tbody>
  ${ops.map(({c,s})=>{const m=w.map(x=>media(c.id,s,x.a,x.b));return`<tr><td><b>${esc(c.nome)}</b></td><td><span class="dot" style="background:${ST[s].c}"></span>${ST[s].s}</td>${m.map(v=>`<td class="n">${v?fn(v):'-'}</td>`).join('')}<td>${trend(m[3],m[2])}</td></tr>`}).join('')}</tbody></table></div></section>`}
function tabelaMeses(){const c=cfg();let tp=0;const tt={dig:0,foto:0,fin:0,ent:0,apr:0};
  const rows=monthsList().map(y=>{const a=y===ymOf(c.inicio)?c.inicio:`${y}-01`,b=lastOfM(y)>c.fimPrazo?c.fimPrazo:lastOfM(y),dd=utilDays(a,b).length,mp=sumPlan('capt',a,b),t=totals(a,b);tp+=mp;for(const k in tt)tt[k]+=t[k];const mt=c.metas[y]||{};
    return`<tr class="click ${y===ui.ym?'cur':''}" data-act="goM" data-v="${y}"><td>${MES[+y.slice(5,7)-1]}</td><td class="n">${dd}</td><td class="n">${fn((mt.dig||0)+(mt.foto||0))}</td><td class="n">${fn(mp)}</td><td class="n">${fn(t.dig)}</td><td class="n">${fn(t.foto)}</td><td class="n">${fn(t.fin)}</td><td class="n">${fn(t.ent)}</td><td class="n">${fn(t.apr)}</td><td class="n">${mp?fn(t.capt/mp*100)+'%':'-'}</td></tr>`}).join('');
  return`<div class="tw"><table><thead><tr><th>Mês</th><th class="n">Dias úteis</th><th class="n">Meta de captura por dia</th><th class="n">Meta do mês</th><th class="n">Escâner</th><th class="n">Fotos</th><th class="n">Finalizadas</th><th class="n">Entregues</th><th class="n">Aprovadas</th><th class="n">Captura contra meta</th></tr></thead><tbody>${rows}
  <tr class="tot"><td>Total</td><td class="n">${utilDays(c.inicio,c.fimPrazo).length}</td><td></td><td class="n">${fn(tp)}</td><td class="n">${fn(tt.dig)}</td><td class="n">${fn(tt.foto)}</td><td class="n">${fn(tt.fin)}</td><td class="n">${fn(tt.ent)}</td><td class="n">${fn(tt.apr)}</td><td class="n">${tp?fn((tt.dig+tt.foto)/tp*100)+'%':'-'}</td></tr></tbody></table></div>`}

/* ========= Gráficos ========= */
const tip=$('#tip');
function showTip(html,x,y){tip.innerHTML=html;tip.style.display='block';const r=tip.getBoundingClientRect();tip.style.left=Math.max(6,Math.min(innerWidth-r.width-6,x+14))+'px';tip.style.top=Math.max(6,y-r.height-12)+'px'}
const hideTip=()=>tip.style.display='none';
function drawBurn(){const el=$('#cBurn');if(!el)return;const c=cfg(),W=el.clientWidth||700,H=W<520?230:290,P={l:52,r:14,t:12,b:26},h=hoje();
  const days=utilDays(c.inicio,c.fimPrazo);const X=i=>P.l+(W-P.l-P.r)*(days.length>1?i/(days.length-1):0),Y=v=>H-P.b-(H-P.t-P.b)*v/TOTAL;
  const K=Object.keys(STG),cum={plan:[]};let pl=0;days.forEach(d=>{pl+=planDay('capt',d);cum.plan.push(pl)});
  K.forEach(k=>{const s=serieDia(k);let a=Object.entries(s).filter(([d])=>d<c.inicio).reduce((t,[,q])=>t+q,0);
    /* dias sem expediente também entram no acumulado */
    const keys=Object.keys(s).sort();let j=0;cum[k]=days.map(d=>{while(j<keys.length&&keys[j]<=d){if(keys[j]>=c.inicio)a+=s[keys[j]];j++}return a})});
  const n=days.filter(d=>d<=h).length;
  const grid=[0,100000,200000,300000,400000].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceef1"/><text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end">${v?fn(v/1000)+' mil':'0'}</text>`).join('');
  const xl=monthsList().map(y=>{const i=days.findIndex(d=>ymOf(d)===y);return i<0?'':`<text x="${X(i)}" y="${H-7}">${MES[+y.slice(5,7)-1].slice(0,3).toLowerCase()}</text><line x1="${X(i)}" x2="${X(i)}" y1="${H-P.b}" y2="${H-P.b+4}" stroke="#c6cbd3"/>`}).join('');
  const iA=days.filter(d=>d<=c.fimAlvo).length-1;
  const mk=`<line x1="${X(iA)}" x2="${X(iA)}" y1="${P.t}" y2="${H-P.b}" stroke="#b9bec7" stroke-dasharray="2 3"/><text x="${X(iA)+5}" y="${H-P.b-8}">Meta de 5 meses</text>`;
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  const lines=`<path d="${path(cum.plan)}" fill="none" stroke="#6c7380" stroke-width="2" stroke-dasharray="5 4"/>`+(n?K.map(k=>`<path d="${path(cum[k].slice(0,n))}" fill="none" stroke="${STG[k].hex}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join(''):'');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Produção acumulada contra o plano">${grid}${xl}${mk}${lines}<line id="bx" y1="${P.t}" y2="${H-P.b}" stroke="#16181d" visibility="hidden"/><rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/></svg>`;
  const svg=el.querySelector('svg'),bx=el.querySelector('#bx');
  const mv=e=>{const r=svg.getBoundingClientRect(),i=Math.max(0,Math.min(days.length-1,Math.round((e.clientX-r.left-P.l)/(r.width/W*(W-P.l-P.r))*(days.length-1))));
    bx.setAttribute('x1',X(i));bx.setAttribute('x2',X(i));bx.setAttribute('visibility','visible');
    showTip(`<b>${br(days[i])}</b><br>Plano de captura: ${fn(cum.plan[i])}`+(i<n?K.map(k=>`<br><i style="background:${STG[k].hex}"></i>${STG[k].n}: ${fn(cum[k][i])}`).join(''):''),e.clientX,e.clientY)};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',()=>{hideTip();bx.setAttribute('visibility','hidden')})}
function drawDay(){const el=$('#cDay');if(!el)return;const a=`${ui.ym}-01`,b=lastOfM(ui.ym),st=ui.st,days=utilDays(a,b);
  if(!days.length){el.innerHTML='<div class="empty">Este mês não tem dias úteis no contrato.</div>';return}
  const W=el.clientWidth||700,H=210,P={l:44,r:6,t:10,b:24};const q={};for(const l of lancs())if(l.func===st&&inR(l,a,b))q[l.data]=(q[l.data]||0)+num(l.qtd);
  const mx=Math.max(1000,...days.map(d=>Math.max(q[d]||0,planDay(st,d))))*1.1,Y=v=>H-P.b-(H-P.t-P.b)*v/mx,bw=(W-P.l-P.r)/days.length,gap=Math.max(2,bw*.25);
  const step=mx>12000?5000:mx>6000?2000:1000;let grid='';for(let v=0;v<=mx;v+=step)grid+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceef1"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${v?fn(v/1000)+' mil':'0'}</text>`;
  const bars=days.map((d,i)=>{const x=P.l+i*bw+gap/2,w=bw-gap,v=q[d]||0,y=Y(v),m=planDay(st,d),r=Math.min(4,w/2);
    const bar=v>0?`<path d="M${x} ${Y(0)}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${Y(0)}Z" fill="${ST[st].hex}"/>`:'';
    const lab=(days.length<=12||i%2===0)?`<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${+d.slice(8)}</text>`:'';
    return`${bar}${m?`<line x1="${x-gap/2}" x2="${x+w+gap/2}" y1="${Y(m)}" y2="${Y(m)}" stroke="#16181d" stroke-width="2"/>`:''}${lab}<rect data-i="${i}" x="${x-gap/2}" y="${P.t}" width="${bw}" height="${H-P.t-P.b}" fill="transparent"/>`}).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Produção diária contra a meta">${grid}${bars}</svg>`;
  const svg=el.querySelector('svg');const mv=e=>{const i=e.target.dataset?.i;if(i==null){hideTip();return}const d=days[i],v=q[d]||0,m=planDay(st,d);showTip(`<b>${br(d)}</b><br>${ST[st].q}: ${fn(v)}<br>Meta: ${fn(m)}${m?`<br>${fn(v/m*100)}% da meta`:''}`,e.clientX,e.clientY)};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',hideTip)}

    ${f.func==='fin'?`<label class="f">Origem das imagens<select name="orig" data-lf>${Object.entries(ORIG).map(([k,v])=>`<option value="${k}" ${f.orig===k?'selected':''}>${v}</option>`).join('')}</select></label>`:''}
    <label class="f">${ST[f.func].q}<input class="big-in" id="qtd" name="qtd" type="number" min="0" inputmode="numeric" value="${esc(f.qtd)}" required data-lf></label>

  const evs=[];for(let x=a;x<=b;x=nextD(x))for(const c of colabs()){const p=presOf(x,c.id);if(p&&(p.status==='falta'||p.status==='parcial'||p.obs))evs.push({x,c,p})}
  return`<section class="panel"><div class="spread"><div class="row"><button class="btn noprint" data-act="diaP" aria-label="Dia anterior">‹</button><input class="inp" style="width:auto" type="date" value="${d}" data-filter="dia"><button class="btn noprint" data-act="diaN" aria-label="Próximo dia">›</button><span class="sub">${isUtil(d)?`Dia útil, meta de captura de ${fn(planDay('capt',d))}`:'Sem expediente previsto'}${f?', fechado':''}</span></div><button class="btn noprint" data-act="print">Imprimir</button></div>
  ${cs.length?`<div class="tw"><table><thead><tr><th>Operador</th><th>Produção do dia</th><th>Situação</th><th>Horas trabalhadas</th><th>Acontecimento</th></tr></thead><tbody>${cs.map(c=>{const p=presOf(d,c.id)||{},ls=lancs().filter(l=>l.colab===c.id&&l.data===d),by={};ls.forEach(l=>by[l.func]=(by[l.func]||0)+num(l.qtd));const hl=ls.reduce((t,l)=>t+num(l.horas),0);
    return`<tr><td><b>${esc(c.nome)}</b></td><td class="small">${Object.entries(by).map(([s,q])=>`<span class="dot" style="background:${stC(s)}"></span>${ST[s]?.s||stN(s)}: <b>${fn(q)}</b>`).join('<br>')||'<span class="muted">Sem lançamento</span>'}</td>
    <td><select data-pres="${c.id}|status" ${f?'disabled':''} aria-label="Situação de ${esc(c.nome)}"><option value="">Sem registro</option>${Object.entries(SIT).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></td>
    <td><input class="num" type="number" min="0" max="24" step="any" data-pres="${c.id}|horas" value="${p.horas??''}" placeholder="${hl?fn(hl,1):''}" ${f?'disabled':''} aria-label="Horas de ${esc(c.nome)}"></td>
    <td style="min-width:220px"><input data-pres="${c.id}|obs" value="${esc(p.obs)}" ${f?'disabled':''} placeholder="Ex.: avisou que não viria" aria-label="Acontecimento de ${esc(c.nome)}"></td></tr>`}).join('')}</tbody></table></div>
    <p class="small sub" style="margin-top:10px">Tudo aqui salva automaticamente. As horas informadas substituem as horas dos lançamentos daquele dia.</p>`:'<div class="empty">Nenhum operador ativo nesta data.</div>'}</section>
  <section class="panel"><h2>Acontecimentos de ${ymLabel(ui.ym).toLowerCase()}</h2>${evs.length?`<div class="tw"><table><thead><tr><th>Data</th><th>Operador</th><th>Situação</th><th>Acontecimento</th></tr></thead><tbody>${evs.map(e=>`<tr><td>${br2(e.x)}</td><td>${esc(e.c.nome)}</td><td>${sitBadge(e.p.status)}</td><td class="small">${esc(e.p.obs)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma falta ou acontecimento registrado neste mês.</div>'}</section>`}

/* ========= Tarefas ========= */
const PRI={alta:['Alta','c'],media:['Média','w'],baixa:['Baixa','z']};
function V_tarefas(){const ts=all('tar').sort((x,y)=>(x.feita?1:0)-(y.feita?1:0)||(x.prazo||'9').localeCompare(y.prazo||'9')),h=hoje();
  const a=`${ui.ym}-01`,b=lastOfM(ui.ym),show=ts.filter(t=>!t.feita||(t.feitaEm>=a&&t.feitaEm<=b)),notas=all('diario').filter(n=>inR(n,a,b)).sort((x,y)=>x.data<y.data?1:-1);

   ${show.length?`<div class="tw"><table><tbody>${show.map(t=>`<tr><td style="width:30px"><input type="checkbox" data-tar="${t.id}" ${t.feita?'checked':''} aria-label="Concluir ${esc(t.titulo)}" style="width:18px;height:18px;min-height:0"></td><td><span style="${t.feita?'text-decoration:line-through;color:var(--ink3)':''}"><b>${esc(t.titulo)}</b></span><br><span class="small sub">${esc(t.resp)}${t.resp&&t.prazo?', ':''}${t.prazo?`prazo ${br(t.prazo)}`:''}</span>${t.obs?`<br><span class="small">${esc(t.obs)}</span>`:''}</td><td>${!t.feita&&t.prazo&&t.prazo<h?'<span class="bdg c">Atrasada</span> ':''}<span class="bdg ${PRI[t.pri]?.[1]||'z'}">${PRI[t.pri]?.[0]||''}</span></td><td class="noprint n"><button class="btn sm" data-act="editTar" data-v="${t.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma tarefa em aberto.</div>'}</section>
  <section class="panel"><div class="spread"><h2>Anotações do supervisor</h2><div class="row noprint"><button class="btn" data-act="print">Imprimir</button><button class="btn pri" data-act="newNota">Nova anotação</button></div></div>
   ${notas.length?notas.map(n=>`<div style="border-bottom:1px solid var(--line2);padding:9px 0"><div class="spread"><b>${br(n.data)}${n.autor?`, ${esc(n.autor)}`:''}</b><button class="btn sm noprint" data-act="editNota" data-v="${n.id}">Editar</button></div><p style="white-space:pre-wrap;margin-top:3px">${esc(n.texto)}</p></div>`).join(''):`<div class="empty">Nada anotado em ${ymLabel(ui.ym).toLowerCase()}.</div>`}</section></div>`}
function dlgTar(id){const t=id?all('tar').find(x=>x.id===id):{pri:'media'};
  openDlg(id?'Editar tarefa':'Nova tarefa',`<div class="form"><label class="f wide">Tarefa<input name="titulo" value="${esc(t.titulo)}" required></label><label class="f">Responsável<input name="resp" value="${esc(t.resp)}" list="dlC"><datalist id="dlC">${colabs().map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist></label><label class="f">Prazo<input type="date" name="prazo" value="${t.prazo||''}"></label><label class="f">Prioridade<select name="pri">${Object.entries(PRI).map(([k,v])=>`<option value="${k}" ${t.pri===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><label class="f wide">Observações<textarea name="obs" rows="2">${esc(t.obs)}</textarea></label></div>`,
   fd=>{if(!fd.get('titulo').trim())return false;put('tar',{...t,titulo:fd.get('titulo').trim(),resp:fd.get('resp'),prazo:fd.get('prazo'),pri:fd.get('pri'),obs:fd.get('obs')});toast('Tarefa salva.')},id?()=>confirmar('Excluir esta tarefa?',()=>del('tar',t)):null)}
function dlgNota(id){const n=id?all('diario').find(x=>x.id===id):{data:hoje()};
  openDlg(id?'Editar anotação':'Nova anotação',`<div class="form"><label class="f">Data<input type="date" name="data" value="${n.data}" required></label><label class="f">Supervisor<input name="autor" value="${esc(n.autor)}" list="dlS"><datalist id="dlS">${colabs().filter(c=>(c.funcs||[]).includes('sup')).map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist></label><label class="f wide">O que aconteceu hoje<textarea name="texto" rows="5" required>${esc(n.texto)}</textarea></label></div>`,
   fd=>{if(!fd.get('texto').trim())return false;put('diario',{...n,data:fd.get('data'),autor:fd.get('autor'),texto:fd.get('texto')});toast('Anotação salva.')},id?()=>confirmar('Excluir esta anotação?',()=>del('diario',n)):null)}

/* ========= Acervo e nomenclatura ========= */
const san=s=>String(s||'').trim();
function nomeObra(o){return o.tipo==='P'?`${san(o.registro)}_P_OR`:`${san(o.registro)}_${san(o.ano)}_${san(o.vol)}_OR`}
const NOME_OK=[/^[^_\s]+_\d{4}_[^_\s]+_OR$/,/^[^_\s]+_P_OR$/];
const PASTAS=[['m','Master TIFF'],['d','TIFF Derivado'],['c','PDF com OCR']];
function V_acervo(){const list=all('acervo').sort((a,b)=>String(a.registro).localeCompare(String(b.registro),'pt-BR',{numeric:true}));const q=ui.aq.toLowerCase();const f=q?list.filter(o=>(nomeObra(o)+' '+(o.titulo||'')).toLowerCase().includes(q)):list;
  const names={};list.forEach(o=>{const n=nomeObra(o);names[n]=(names[n]||0)+1});const pg=list.reduce((t,o)=>t+num(o.paginas),0);const done=k=>list.filter(o=>o[k]).length;
  return`<section class="panel"><h2>As três pastas de cada entrega</h2><div class="tw"><table><thead><tr><th>Pasta</th><th>Formato</th><th>Como é feita</th></tr></thead><tbody>
   <tr><td><b>Master TIFF</b></td><td>TIFF, 300 DPI</td><td>Gerada pelo escâner: 100% das dimensões do original, com margem de 0,5 cm nos quatro lados</td></tr>
   <tr><td><b>TIFF Derivado</b></td><td>TIFF, 300 DPI</td><td>Gerada pelo escâner, com Deskew, Crop e Unsharp</td></tr>
   <tr><td><b>PDF com OCR</b></td><td>PDF</td><td>Feito no notebook com o PDF24 a partir do Derivado, com o texto do OCR sob a imagem; depois passa pelo controle de qualidade</td></tr></tbody></table></div>
   <p class="small sub" style="margin-top:8px">As fotos da câmera (JPG) serão convertidas depois em Master TIFF, TIFF Derivado e PDF com OCR.</p>
   <div class="grid2" style="margin-top:14px"><div><h3>Nomes dos arquivos</h3><p style="margin-top:4px">Livros: <span class="code">Registro_Ano_Volume_OR</span><br>Periódicos: <span class="code">Registro_P_OR</span></p></div>
   <label class="f noprint">Conferir um nome<input class="inp" id="chkName" placeholder="Ex.: 12345_1985_02_OR"><span id="chkRes" class="small"></span></label></div></section>
  <section class="panel"><div class="spread"><h2>Obras cadastradas: ${fn(list.length)}${pg?`, ${fn(pg)} páginas`:''}</h2><div class="row noprint"><input class="inp" style="width:190px" placeholder="Buscar" data-filter="aq" value="${esc(ui.aq)}"><button class="btn" data-act="importAc">Colar lista</button><button class="btn" data-act="print">Imprimir</button><button class="btn pri" data-act="newObra">Cadastrar obra</button></div></div>
  ${list.length?`<p class="small sub" style="margin-bottom:8px">Prontas: ${PASTAS.map(([k,l])=>`${l} ${done(k)}`).join(', ')}.</p>`:''}
  ${f.length?`<div class="tw"><table><thead><tr><th>Nome do arquivo</th><th>Tipo</th><th>Título</th><th class="n">Páginas</th><th>Pastas prontas</th><th class="noprint"></th></tr></thead><tbody>${f.slice(0,300).map(o=>{const n=nomeObra(o);return`<tr><td><span class="code">${esc(n)}</span>${names[n]>1?' <span class="bdg c">Nome repetido</span>':''}${NOME_OK.some(r=>r.test(n))?'':' <span class="bdg w">Conferir</span>'}</td><td>${o.tipo==='P'?'Periódico':'Livro'}</td><td class="small">${esc(o.titulo)}</td><td class="n">${o.paginas?fn(o.paginas):''}</td><td><div class="row" style="flex-wrap:nowrap;gap:4px">${PASTAS.map(([k,l])=>`<button class="chip ${o[k]?'on':''}" data-act="obraSt" data-v="${o.id}|${k}" aria-pressed="${!!o[k]}">${l}</button>`).join('')}</div></td><td class="noprint n"><button class="btn sm" data-act="copyName" data-v="${esc(n)}">Copiar nome</button> <button class="btn sm" data-act="editObra" data-v="${o.id}">Editar</button></td></tr>`}).join('')}</tbody></table></div>${f.length>300?`<p class="small sub" style="margin-top:8px">Mostrando 300 de ${fn(f.length)}. Use a busca para encontrar as demais.</p>`:''}`:'<div class="empty">Cadastre as obras para gerar os nomes no padrão do contrato.</div>'}</section>`}
function dlgObra(id){const o=id?all('acervo').find(x=>x.id===id):{tipo:'L'};
  openDlg(id?'Editar obra':'Cadastrar obra',`<div class="form"><label class="f">Tipo<select name="tipo"><option value="L" ${o.tipo!=='P'?'selected':''}>Livro</option><option value="P" ${o.tipo==='P'?'selected':''}>Periódico</option></select></label><label class="f">Registro<input name="registro" value="${esc(o.registro)}" required></label><label class="f">Ano de registro (livro)<input name="ano" inputmode="numeric" maxlength="4" value="${esc(o.ano)}"></label><label class="f">Volume ou tomo (livro)<input name="vol" value="${esc(o.vol)}"></label><label class="f wide">Título (opcional)<input name="titulo" value="${esc(o.titulo)}"></label><label class="f">Páginas<input type="number" min="0" name="paginas" value="${esc(o.paginas)}"></label></div>`,
   fd=>{const r={...o,tipo:fd.get('tipo'),registro:san(fd.get('registro')),ano:san(fd.get('ano')),vol:san(fd.get('vol')),titulo:fd.get('titulo'),paginas:num(fd.get('paginas'))};if(!r.registro)return false;if(r.tipo==='L'&&(!/^\d{4}$/.test(r.ano)||!r.vol)){toast('Para livro, informe o ano com 4 dígitos e o volume ou tomo.');return false}r.id=r.id||nid();put('acervo',r);toast(`Nome gerado: ${nomeObra(r)}`)},id?()=>confirmar('Excluir esta obra?',()=>del('acervo',o)):null)}
function dlgImport(){openDlg('Colar lista de obras',`<p class="small sub" style="margin-bottom:8px">Uma obra por linha, separando por ponto e vírgula ou tabulação, na ordem: tipo (L ou P); registro; ano; volume; título; páginas. Dá para copiar direto do Excel.</p><textarea class="inp" name="txt" rows="9" placeholder="L;12345;1985;02;Anais do Congresso;320&#10;P;67890;;;Revista Agrária;48"></textarea>`,
  fd=>{const out=[];for(const ln of fd.get('txt').split(/\r?\n/)){if(!ln.trim())continue;const p=ln.split(/[;\t]/).map(x=>x.trim());const tipo=/^p/i.test(p[0])?'P':'L';if(!p[1])continue;out.push({id:nid(),tipo,registro:p[1],ano:p[2]||'',vol:p[3]||'',titulo:p[4]||'',paginas:num(p[5])})}
    if(!out.length){toast('Nenhuma linha válida.');return false}putMany('acervo',out);toast(`${out.length} obras cadastradas.`)})}

/* ========= Fechamento ========= */
function periodo(){const c=cfg();if(ui.fmode==='dia')return{a:ui.fdia,b:ui.fdia,t:`Dia ${br(ui.fdia)}`,key:ui.fdia};if(ui.fmode==='proj')return{a:c.inicio,b:c.fimPrazo,t:'Todo o contrato'};const a=`${ui.ym}-01`;return{a,b:lastOfM(ui.ym),t:ymLabel(ui.ym),key:ui.ym}}

  const cs=[...new Set(rows.map(r=>r.c))];
  const evs=[];for(let x=p.a;x<=(p.b>h?h:p.b);x=nextD(x))for(const c of colabs()){const q=presOf(x,c.id);if(q&&(q.status==='falta'||q.status==='parcial'||q.obs))evs.push({x,c,q})}
  const notas=all('diario').filter(n=>inR(n,p.a,p.b)&&ui.fmode==='dia');
  const ep=ents().filter(e=>inR(e,p.a,p.b)||(e.aprovData&&e.aprovData>=p.a&&e.aprovData<=p.b)),np=nfs().filter(n=>n.data>=p.a&&n.data<=p.b);
  const linha=(nome,cor,v,m,ac)=>`<tr><td><span class="dot" style="background:${cor}"></span>${nome}</td><td class="n"><b>${fn(v)}</b></td><td class="n">${m?fn(m):'-'}</td><td class="n">${m?fn(v/m*100)+'%':'-'}</td><td class="n">${fn(ac)}</td><td class="n">${fn(TOTAL-ac)}</td></tr>`;
  const mp=s=>lim>=p.a?sumPlan(s,p.a,lim):0;
  return`<section class="panel noprint"><div class="spread"><div class="row"><div class="seg">${[['dia','Dia'],['mes','Mês'],['proj','Contrato']].map(([k,l])=>`<button data-act="fmode" data-v="${k}" class="${ui.fmode===k?'on':''}">${l}</button>`).join('')}</div>${ui.fmode==='dia'?`<input type="date" class="inp" style="width:auto" value="${ui.fdia}" data-filter="fdia">`:''}</div>
   <div class="row"><button class="btn" data-act="csvFech">CSV</button><button class="btn" data-act="print">Imprimir fechamento</button>${p.key?(f?`<button class="btn" data-act="reabrir" data-v="${p.key}">Reabrir</button>`:`<button class="btn pri" data-act="fechar" data-v="${p.key}">${ui.fmode==='dia'?'Fechar dia':'Fechar mês'}</button>`):''}</div></div>
   ${f?`<p class="note" style="margin-top:12px"><b>Fechado por ${esc(f.por)} em ${br(f.quando)}.</b> Os lançamentos deste período estão travados.</p>`:''}</section>
  <section class="panel"><div class="spread"><h2>Fechamento: ${p.t}</h2>${f?'<span class="bdg g">Fechado</span>':'<span class="bdg w">Em aberto</span>'}</div>
   <div class="tw"><table><thead><tr><th>Etapa</th><th class="n">No período</th><th class="n">Meta do período</th><th class="n">% da meta</th><th class="n">Acumulado no contrato</th><th class="n">Saldo de ${fn(TOTAL)}</th></tr></thead><tbody>
   ${linha('Digitalizadas no escâner',ST.dig.hex,t.dig,mp('dig'),acc.dig)}${linha('Fotos batidas',ST.foto.hex,t.foto,mp('foto'),acc.foto)}
   <tr class="tot"><td>Capturadas (escâner e fotos)</td><td class="n">${fn(t.capt)}</td><td class="n">${fn(mp('capt'))}</td><td class="n">${mp('capt')?fn(t.capt/mp('capt')*100)+'%':'-'}</td><td class="n">${fn(acc.capt)}</td><td class="n">${fn(TOTAL-acc.capt)}</td></tr>
   ${linha('Finalizadas do escâner',ST.fin.hex,t.finEsc,0,acc.finEsc)}${linha('Finalizadas das fotos',ST.fin.hex,t.finFoto,0,acc.finFoto)}
   <tr class="tot"><td>Finalizadas e prontas para envio</td><td class="n">${fn(t.fin)}</td><td class="n">${fn(mp('fin'))}</td><td class="n">${mp('fin')?fn(t.fin/mp('fin')*100)+'%':'-'}</td><td class="n">${fn(acc.fin)}</td><td class="n">${fn(TOTAL-acc.fin)}</td></tr>
   ${linha('Entregues ao cliente',STG.ent.hex,t.ent,0,acc.ent)}${linha('Aprovadas para pagamento',STG.apr.hex,t.apr,0,acc.apr)}${linha('Com nota fiscal emitida','#7b8290',t.nf,0,acc.nf)}
   </tbody></table></div><p class="small sub" style="margin-top:8px">Arquivos prontos no contrato (Master TIFF, TIFF Derivado e PDF com OCR): <b>${fn(acc.fin*DERIV)}</b> de ${fn(TOTAL*DERIV)}.</p></section>
  <section class="panel"><h2>Quantidade por operador</h2>${rows.length?`<div class="tw"><table><thead><tr><th>Operador</th><th>Serviço</th><th class="n">Imagens</th><th class="n">Meta</th><th class="n">%</th><th>Avaliação</th><th class="n">Dias</th><th class="n">Média por dia</th><th class="n">Reprov.</th><th class="n">Horas</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td><b>${esc(r.c.nome)}</b></td><td>${ST[r.s].n}</td><td class="n"><b>${fn(r.qtd)}</b></td><td class="n">${fn(r.meta)}</td><td class="n">${r.p!=null?fn(r.p)+'%':'-'}</td><td>${bdg(r.p)}</td><td class="n">${r.dias}</td><td class="n">${r.med?fn(r.med):'-'}</td><td class="n">${fn(r.rep)}</td><td class="n">${fn(r.hs,1)}</td></tr>`).join('')}
   <tr class="tot"><td colspan="2">Total</td><td class="n">${fn(rows.reduce((s,r)=>s+r.qtd,0))}</td><td colspan="5"></td><td class="n">${fn(rows.reduce((s,r)=>s+r.rep,0))}</td><td class="n">${fn(rows.reduce((s,r)=>s+r.hs,0),1)}</td></tr></tbody></table></div>`:'<div class="empty">Sem produção neste período.</div>'}</section>
  ${cs.length&&ui.fmode==='mes'?`<section class="panel"><h2>Presença e avaliação do supervisor</h2><div class="tw"><table><thead><tr><th>Operador</th><th>Telefone</th><th class="n">Dias com produção</th><th class="n">Faltas</th><th class="n">Horas</th><th>Nota do supervisor</th><th>Comentário</th></tr></thead><tbody>
   ${cs.map(c=>{const pr=presenca(p.a,p.b>h?h:p.b,c.id),nt=(shards.aval||{})[`${ui.ym}_${c.id}`]||{};return`<tr><td><b>${esc(c.nome)}</b></td><td>${esc(c.tel)}</td><td class="n">${pr.dias}</td><td class="n">${pr.faltas}</td><td class="n">${fn(pr.hs,1)}</td><td><select data-aval="${c.id}|nota" ${f?'disabled':''} aria-label="Nota de ${esc(c.nome)}"><option value="">Sem nota</option>${[5,4,3,2,1].map(n=>`<option value="${n}" ${+nt.nota===n?'selected':''}>${n} de 5</option>`).join('')}</select></td><td style="min-width:170px"><input data-aval="${c.id}|com" value="${esc(nt.com)}" ${f?'disabled':''} aria-label="Comentário sobre ${esc(c.nome)}"></td></tr>`}).join('')}</tbody></table></div></section>`:''}
  ${ep.length||np.length?`<section class="panel"><h2>Entregas e notas fiscais do período</h2><div class="tw"><table><thead><tr><th>Data</th><th>Movimento</th><th class="n">Imagens</th><th>Referência</th></tr></thead><tbody>

/* ========= Diálogos ========= */
const dlg=$('#dlg');
function openDlg(title,body,onSave,onDelete,saveLabel='Salvar'){
  dlg.innerHTML=`<form method="dialog"><div class="dh">${esc(title)}</div><div class="db">${body}</div><div class="df">${onDelete?'<button type="button" class="btn dan" data-d="del">Excluir</button>':''}<button type="button" class="btn" data-d="close">Cancelar</button><button type="submit" class="btn pri">${esc(saveLabel)}</button></div></form>`;
  const form=dlg.querySelector('form');
  form.addEventListener('submit',e=>{e.preventDefault();if(onSave(new FormData(form))!==false){dlg.close();render()}});
  dlg.querySelector('[data-d=close]').onclick=()=>dlg.close();
  if(onDelete)dlg.querySelector('[data-d=del]').onclick=()=>{dlg.close();onDelete()};
  dlg.showModal()}
function confirmar(msg,ok,label='Excluir'){openDlg('Confirmar',`<p>${esc(msg)}</p>`,()=>{ok();toast('Feito.')},null,label)}
function dlgLanc(id){const l=lancs().find(x=>x.id===id);if(!l)return;
  openDlg('Editar lançamento',`<div class="form"><label class="f">Data<input type="date" name="data" value="${l.data}" required></label><label class="f">Operador<select name="colab">${colabs().map(c=>`<option value="${c.id}" ${c.id===l.colab?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label class="f">Serviço<select name="func">${ALLST.map(s=>`<option value="${s}" ${s===l.func?'selected':''}>${ST[s].n}</option>`).join('')}</select></label><label class="f">Origem (finalização)<select name="orig">${Object.entries(ORIG).map(([k,v])=>`<option value="${k}" ${(l.orig||'esc')===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="f">Imagens<input type="number" min="0" name="qtd" value="${l.qtd}" required></label><label class="f">Horas<input type="number" min="0" step="any" name="horas" value="${l.horas||''}"></label><label class="f">Reprovadas ou refeitas<input type="number" min="0" name="rep" value="${l.rep||''}"></label><label class="f">Registro da obra<input name="obra" value="${esc(l.obra)}"></label><label class="f wide">Observações<input name="obs" value="${esc(l.obs)}"></label></div>`,
   fd=>{const nd=fd.get('data');if(!aberto(l.data)||!aberto(nd))return false;const func=fd.get('func');put('lanc',{...l,data:nd,colab:fd.get('colab'),func,orig:func==='fin'?fd.get('orig'):'',qtd:num(fd.get('qtd')),horas:num(fd.get('horas')),rep:num(fd.get('rep')),obra:fd.get('obra'),obs:fd.get('obs')});toast('Lançamento alterado.')},
   ()=>{if(aberto(l.data))confirmar('Excluir este lançamento?',()=>del('lanc',l))})}

function csv(nome,rows){const s='﻿'+rows.map(r=>r.map(v=>{const t=String(v??'');return /[;"\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t}).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=nome;a.click();URL.revokeObjectURL(a.href)}

 fmode(e){ui.fmode=e.dataset.v;render()},
 fechar(e){const k=e.dataset.v;openDlg(k.length>7?`Fechar o dia ${br(k)}`:`Fechar ${ymLabel(k).toLowerCase()}`,`<p style="margin-bottom:10px">Depois de fechar, os lançamentos e o diário deste período ficam travados até alguém reabrir.</p><label class="f">Quem está fechando<input name="por" required></label>`,fd=>{const por=fd.get('por').trim();if(!por)return false;put('fech',{id:k,por,quando:hoje(),em:Date.now()});toast('Fechamento registrado.')},null,'Fechar')},

 csvLanc(){const a=`${ui.ym}-01`,b=lastOfM(ui.ym);csv(`lancamentos_${ui.ym}.csv`,[['Data','Operador','Serviço','Origem','Imagens','Reprovadas','Horas','Obra','Observações'],...lancs().filter(l=>inR(l,a,b)).map(l=>[br(l.data),cById(l.colab)?.nome||'',stN(l.func),l.func==='fin'?ORIG[l.orig||'esc']:'',l.qtd,l.rep||'',String(l.horas||'').replace('.',','),l.obra||'',l.obs||''])])},
 csvFech(){const p=periodo();csv(`fechamento_${p.key||'contrato'}.csv`,[['Operador','Telefone','Serviço','Imagens','Meta','%','Avaliação','Dias','Média por dia','Reprovadas','Horas'],...resumo(p.a,p.b).map(r=>[r.c.nome,r.c.tel||'',ST[r.s].n,r.qtd,Math.round(r.meta),r.p!=null?Math.round(r.p):'',nota(r.p).l,r.dias,Math.round(r.med),r.rep,String(r.hs).replace('.',',')])])},
};

document.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};
  if(t.closest&&t.closest('dialog'))return;
  if(t.hasAttribute?.('data-lf')&&t.tagName==='SELECT'){ui.lanc[t.name]=t.value}
  if(t.hasAttribute?.('data-rerender')){t.blur();render();return}

  if(d.filter){ui[d.filter]=t.value;if(d.filter==='dia'||d.filter==='fdia')ui.ym=ymOf(t.value);t.blur();render();return}
  if(d.meta){const[y,s]=d.meta.split('|'),c=cfg();c.metas={...c.metas,[y]:{...(c.metas[y]||{}),[s]:num(t.value)}};t.blur();saveCfg(c);toast('Meta salva.');return}
  if(d.nota){const c=cfg();c.notas={...c.notas,[d.nota]:num(t.value)};t.blur();saveCfg(c);return}
  if(d.pres){if(!aberto(ui.dia)){render();return}const[cid,k]=d.pres.split('|'),id=`${ui.dia}_${cid}`,o=presOf(ui.dia,cid)||{id,data:ui.dia,colab:cid};put('pres',{...o,[k]:k==='horas'?(t.value===''?'':num(t.value)):t.value});return}
  if(d.tar){const o=all('tar').find(x=>x.id===d.tar);put('tar',{...o,feita:t.checked,feitaEm:t.checked?hoje():''});return}
  if(d.aval){const[cid,k]=d.aval.split('|'),id=`${ui.ym}_${cid}`,o=(shards.aval||{})[id]||{id,ym:ui.ym,colab:cid};put('aval',{...o,[k]:t.value});return}
